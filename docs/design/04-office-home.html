const P={check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',warn:'<path d="M12 4 3 19h18z"/><path d="M12 10v4M12 17v.01"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',cross:'<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/>',bell:'<path d="M6 17V11a6 6 0 1 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/>',grid:'<rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/>',chev:'<path d="m7 10 5 5 5-5"/>',plus:'<path d="M12 5v14M5 12h14"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',share:'<path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 13v6h14v-6"/>',archive:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',undo:'<path d="M9 7 4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',ext:'<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v6H4V6h6"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',eyeoff:'<path d="M3 3l18 18"/><path d="M10 6c.6-.1 1.300-.2 2-.2 6 0 10 6.200 10 6.200s-1.200 2-3.200 3.800M6.300 7.500C3.700 9.300 2 12 2 12s4 7 10 7c1.700 0 3.200-.5 4.500-1.200"/>',key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/>',home:'<path d="M3 11 12 4l9 7v9H3z"/>',doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',star:'<path d="m12 3 2.700 5.600 6.100.8-4.500 4.200 1.100 6.100L12 16.800 6.600 19.700l1.100-6.100L3.200 9.400l6.100-.8z"/>'};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n]||''}</svg>`;
const ORGS={l2f:{id:'l2f',name:'Layer2Funnels',mark:'L2',color:'#173a8f',role:'Owner'},aurj:{id:'aurj',name:'Aurj',mark:'Au',color:'#b23a08',role:'Owner'}};
let _t;function toast(m,ok=true){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
t.innerHTML=ic(ok?'check':'info')+'<span></span>';t.lastChild.textContent=m;t.dataset.show='true';clearTimeout(_t);_t=setTimeout(()=>t.dataset.show='false',3200)}
function dialog({title,body,actions,wide}){const prev=document.activeElement,o=document.createElement('div');o.className='ovl';
o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlt" style="${wide?'max-width:620px':''}"><h2 id="dlt">${title}</h2><div class="bd">${body}</div><div class="acts" id="dla"></div></div>`;
document.body.appendChild(o);const close=()=>{o.remove();prev&&prev.focus&&prev.focus()};const a=$('#dla',o);
actions.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='btn '+(x.cls||'');b.textContent=x.label;b.onclick=()=>{if(x.on){const r=x.on(close,b);if(r===false)return}if(!x.keep)close()};a.appendChild(b)});
const f=()=>$$('button,input,select,textarea,[href]',o).filter(e=>!e.disabled);
o.onkeydown=e=>{if(e.key==='Escape'){e.stopPropagation();close()}else if(e.key==='Tab'){const l=f(),i=l.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();l[l.length-1].focus()}else if(!e.shiftKey&&i===l.length-1){e.preventDefault();l[0].focus()}}};
(o.querySelector('[autofocus]')||(actions.find(x=>x.focus)?a.children[actions.findIndex(x=>x.focus)]:null)||f()[0]).focus();return close}
function seg(el,opts,cur,on){el.className='seg';el.innerHTML=opts.map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${k===cur}">${l}</button>`).join('');
$$('button',el).forEach(b=>b.onclick=()=>{$$('button',el).forEach(x=>x.setAttribute('aria-pressed',x===b));on(b.dataset.k)})}
/* shared header: launcher button, org switcher, search, bell, profile. opts:{launcherCurrent,onOrg,searchLabel} */
function mountHeader(root,st,o={}){
root.innerHTML=`<button class="iconbtn" aria-label="Open the app Launcher" ${o.launcherCurrent?'aria-current="page"':''} data-act="launcher">${ic('grid')}</button>
<div class="swwrap"><button class="sw" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-${root.id}"><span class="mark">${ORGS[st.org].mark}</span><span class="t"><small>Organization</small><strong>${ORGS[st.org].name}</strong></span>${ic('chev')}</button>
<div class="menu" id="menu-${root.id}" role="menu" aria-label="Switch organization" data-open="false"></div></div>
<label class="search">${ic('search')}<span class="sr">Search this organization</span><input type="search" placeholder="Search ${ORGS[st.org].name}" autocomplete="off"></label>
<button class="iconbtn hide-s" aria-label="Notifications, 3 new">${ic('bell')}<span class="badge" aria-hidden="true">3</span></button><span class="who" role="img" aria-label="Your profile: Tabish Riaz">TR</span>`;
const sw=$('.sw',root),m=$('.menu',root);
const close=(f)=>{m.dataset.open='false';sw.setAttribute('aria-expanded','false');if(f)sw.focus()};
sw.onclick=()=>{if(m.dataset.open==='true')return close(true);
m.innerHTML=`<div class="mh">Your organizations</div>`+Object.values(ORGS).map(g=>`<button class="opt" role="menuitemradio" aria-checked="${g.id===st.org}" data-k="${g.id}"><span class="mk" style="background:${g.color}">${g.mark}</span><span class="tx"><strong>${g.name}</strong><small>${g.role}</small></span>${g.id===st.org?`<span class="st">${ic('check')}Current</span>`:''}</button>`).join('')+`<div class="mfoot">Switching keeps you on the same page where it exists. The full set of switch outcomes is in the approved switcher board.</div>`;
m.dataset.open='true';sw.setAttribute('aria-expanded','true');$$('.opt',m).forEach(b=>b.onclick=()=>{close();if(b.dataset.k!==st.org)o.onOrg&&o.onOrg(b.dataset.k)});($('[aria-checked=true]',m)).focus()};
m.onkeydown=e=>{const it=$$('.opt',m),i=it.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();it[(i+1)%it.length].focus()}else if(e.key==='ArrowUp'){e.preventDefault();it[(i-1+it.length)%it.length].focus()}else if(e.key==='Escape'){close(true)}else if(e.key==='Tab')close()};
document.addEventListener('click',e=>{if(m.dataset.open==='true'&&!e.target.closest('.swwrap'))close()});
$('[data-act=launcher]',root).onclick=()=>o.onLauncher&&o.onLauncher();}
const NI={Home:'home',Planner:'clock',Projects:'doc',Funnels:'star',Documents:'doc',Team:'user',Apps:'grid',Admin:'key',Clients:'user','Requests & Approvals':'check','SOPs & Tools':'doc',Settings:'key',Dashboard:'home',Reports:'doc',More:'more'};
const NS={'Requests & Approvals':'Requests','SOPs & Tools':'SOPs','Documents':'Docs'};
function nav(root,app,items,cur,on,o={}){root.innerHTML=`<span class="appname">${app}</span>`+items.map(p=>`<button type="button" data-p="${p}" ${p===cur?'aria-current="page"':''}>${p}</button>`).join('');$$('button[data-p]',root).forEach(b=>b.onclick=()=>on(b.dataset.p));
 const fr=root.closest('.frame');if(!fr)return;$$('.bnav:not(.mock)',fr).forEach(e=>e.remove());if(o.bottom===false){return}
 root.classList.add('has-b');document.body.classList.add('hasb');
 const main=items.length>5?items.slice(0,4):items,more=items.length>5?items.slice(4):[],inMore=more.includes(cur);
 const b=document.createElement('nav');b.className='bnav';b.setAttribute('aria-label',app+' sections');
 b.innerHTML=main.map(p=>`<button type="button" data-p="${p}" ${p===cur?'aria-current="page"':''}>${ic(NI[p]||'doc')}<span>${NS[p]||p}</span></button>`).join('')+(more.length?`<button type="button" data-more="1" aria-haspopup="dialog" ${inMore?'aria-current="page"':''}>${ic('more')}<span>More</span></button>`:'');
 fr.appendChild(b);$$('button[data-p]',b).forEach(x=>x.onclick=()=>on(x.dataset.p));
 const mb=$('[data-more]',b);if(mb)mb.onclick=()=>{let cl;const h=more.map(p=>`<button type="button" class="btn" data-m="${p}" style="justify-content:flex-start;width:100%;margin-bottom:8px" ${p===cur?'aria-current="page"':''}>${ic(NI[p]||'doc')}${p}</button>`).join('');
  cl=dialog({title:'More in '+app,body:h,actions:[{label:'Close',focus:1}]});$$('[data-m]',document).forEach(x=>x.onclick=()=>{cl();on(x.dataset.m)})}}
function pageHead(crumb,title,sub,right=''){return `<div class="crumb">${crumb}</div><div style="display:flex;flex-wrap:wrap;gap:var(--space-3);justify-content:space-between;align-items:flex-start"><div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="acts">${right}</div></div>`}
const SAMPLE='Sample data, not real records.';
const PLATE=`<svg viewBox="0 0 120 90" width="120" height="90" aria-hidden="true" style="flex:none"><g stroke="#1b1f27" stroke-opacity=".12"><path d="M60 52 100 70 60 88 20 70z" fill="#c9cfd8"/><path d="M60 38 100 56 60 74 20 56z" fill="var(--tint,#e3eafa)"/><path d="M60 24 100 42 60 60 20 42z" fill="var(--accent,#ff7a59)"/><path d="M60 10 100 28 60 46 20 28z" fill="var(--primary,#173a8f)"/></g></svg>`;


const D={l2f:{notice:'Planner review is due Friday. Two goals still need an update.',
 attn:[['Approve landing page copy','Harry Kaye PT · quiz funnel','Approval','Today'],['Review checkout audit notes','Victor · checkout audit','Review','Tomorrow']],
 work:[['Send Harry Kaye’s brand base','Brand base: new client','Today','In progress'],['Update Q4 goal: 4 funnels live','Planner','Fri','Not started'],['Edit quiz funnel emails','Quiz funnel rebuild','Next Mon','Planned']],
 dl:[['Planner review','Fri'],['Quiz funnel launch','Oct 30'],['Brand base due: new client','Nov 2']],
 up:['Hammad finished “Outreach list 14”','Mustafa added 3 thumbnails to Quiz funnel rebuild','Shahriyar uploaded the intro cut']},
 aurj:{notice:'Lesson batch 3 review is on Thursday.',
 attn:[['Approve Lesson 12 script','Lesson library, batch 3','Approval','Today']],
 work:[['Record Lesson 12 voice-over','Lesson library, batch 3','Wed','In progress'],['Check Urdu intro captions','Urdu intro series','Thu','Planned']],
 dl:[['Batch 3 review','Thu'],['OIT pilot notes','Oct 28']],up:['Waqar Shah Sir left feedback on Lesson 11']}};
let st={org:'l2f',role:'owner',quiet:false};const F=$('#frame'),M=$('#main');
seg($('#sg1'),[['owner','Owner'],['admin','Admin'],['editor','Editor']],'owner',k=>{st.role=k;draw()});
seg($('#sg2'),[['busy','Busy day'],['quiet','Quiet day']],'busy',k=>{st.quiet=k==='quiet';draw()});
const PG=['Home','Planner','Projects','Funnels','Documents','Team','Apps','Admin'];
function draw(){F.dataset.theme=st.org;const o=ORGS[st.org],d=D[st.org];
mountHeader($('#hdr'),st,{onOrg:k=>{st.org=k;draw();toast('Now in '+ORGS[k].name+' · Home')},onLauncher:()=>toast('Opens the Launcher (you chose it).',false)});
nav($('#nav'),'Office',PG,'Home',p=>p!=='Home'&&toast(p==='Funnels'||p==='Admin'?p+' is designed in groups '+(p==='Funnels'?'5':'4'):p+' is designed in a later batch.',false));
const attn=st.quiet?[]:d.attn,work=st.quiet?[]:d.work;
M.innerHTML=`<div class="real">${pageHead('Office · '+o.name,'Home','Your work in '+o.name+'. '+SAMPLE)}
${!st.quiet?`<div class="notice warn">${ic('clock')}<p><b>Coming up:</b> ${d.notice}</p></div>`:''}
<div class="split"><div class="grid">
<section class="card" aria-labelledby="h1"><h3 id="h1">Needs your attention</h3>${attn.length?attn.map(a=>`<div class="item"><div><b>${a[0]}</b><span class="m">${a[1]} · Due ${a[3]}</span></div><div class="acts"><span class="pill warn">${a[2]}</span><button class="btn" data-t="${a[0]}">Open</button></div></div>`).join(''):`<div class="eb">${ic('check')}<span><b style="color:var(--ink)">Nothing needs you right now.</b><br>Approvals and reviews assigned to you show up here.</span></div>`}</section>
<section class="card" aria-labelledby="h2"><h3 id="h2">My work</h3>${work.length?work.map(a=>`<div class="item"><div><b>${a[0]}</b><span class="m">${a[1]} · Due ${a[2]}</span></div><span class="pill ${a[3]==='In progress'?'pri':''}">${a[3]}</span></div>`).join(''):`<div class="eb">${ic('home')}<span><b style="color:var(--ink)">Nothing assigned to you.</b><br>When someone gives you a task in ${o.name}, it appears here with its due date.</span></div>`}</section>
</div><div class="grid">
<section class="card" aria-labelledby="h3x"><h3 id="h3x">Deadlines</h3>${st.quiet?`<div class="eb">${ic('clock')}<span>No deadlines in the next two weeks.</span></div>`:d.dl.map(a=>`<div class="dl"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('')}</section>
<section class="card" aria-labelledby="h4"><h3 id="h4">Recent updates</h3><p class="sec">Only from things you can open.</p>${st.quiet?`<div class="eb">${ic('info')}<span>No updates yet today.</span></div>`:d.up.map(a=>`<div class="dl"><span>${a}</span></div>`).join('')}</section>
${st.role!=='editor'?`<section class="card" aria-labelledby="h5"><h3 id="h5">For owners and admins</h3><div class="dl"><span>2 invitations waiting</span><button class="btn link" data-t="Members">Review</button></div><div class="dl"><span>Client Portal is locked</span><span class="pill warn">${ic('lock')}Locked</span></div></section>`:''}
<section class="card" aria-labelledby="h6"><h3 id="h6">Shortcuts</h3><div class="short"><button class="btn" data-t="Planner">Planner</button><button class="btn" data-t="Projects">Projects</button><button class="btn" data-t="Funnels">Funnels</button><button class="btn" data-t="Documents">Documents</button></div></section>
</div></div></div>`;
$$('[data-t]',M).forEach(b=>b.onclick=()=>toast('Opens '+b.dataset.t+' (designed separately).',false))}
draw();
</script></body></html>
