.sp h3 .ev{margin-left:auto;text-transform:none;letter-spacing:0}
.sp ul{list-style:none;display:grid;gap:8px;font-size:14.5px}
.sp li{display:flex;gap:8px;align-items:flex-start}
.sp li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--brand-deep));margin-top:8px;flex-shrink:0}
.left .sp::after,.right .sp::after{content:"";position:absolute;top:28px;width:28px;height:2px;background:linear-gradient(90deg,var(--line2),transparent)}
.left .sp::after{right:-28px;transform:scaleX(-1)}
.right .sp::after{left:-28px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{padding:10px;border-radius:14px;background:var(--sunk);text-align:center}
.stat3 b{display:block;font:700 18px/1.1 var(--font-d)}
.stat3 small{color:var(--muted);font-size:12px}
.quote{padding:10px 12px;border-radius:12px;background:var(--sunk);font:italic 400 15.5px/1.4 "Newsreader",Georgia,serif}
.ev-v{color:var(--action)}
.ev-a{color:var(--warn)}
.swatch{display:grid;gap:8px}
.swatch i{display:block;height:96px;border-radius:18px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.docpage{max-width:820px;margin:0 auto;padding:clamp(24px,5vw,56px);border-radius:8px;background:var(--surface);border:var(--bw) solid var(--line);box-shadow:var(--sh2);min-height:70vh}
.docpage [contenteditable]{outline:none}
.docpage h1{font:700 34px/1.1 var(--font-d);letter-spacing:-.03em;margin-bottom:8px}
.docpage h2{font:700 21px/1.25 var(--font-d);margin:26px 0 8px}
.docpage p,.docpage li{font-size:16px;line-height:1.7;color:var(--text)}
.docpage ul{padding-left:22px}
.ed-tools{display:flex;align-items:center;gap:2px;flex-wrap:nowrap;overflow-x:auto;padding:6px 10px;border-bottom:var(--bw) solid var(--line);background:var(--surface);position:sticky;top:64px;z-index:4;scrollbar-width:none}
.ed-tools button,.ed-tools .sel{min-width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;color:var(--text2);flex-shrink:0}
.ed-tools .sel{min-height:40px;display:inline-block;font-size:13px}
.ed-tools button:hover,.ed-tools button[aria-pressed="true"]{background:var(--sunk);color:var(--text)}
.ed-tools .vs{width:1px;height:24px;background:var(--line2);margin:0 6px;flex-shrink:0}
.edbody{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;gap:22px;padding:22px;align-items:start}
.outline{display:grid;gap:2px;position:sticky;top:130px;font-size:13.5px}
.outline button{text-align:left;min-height:36px;padding:0 10px;border-radius:8px;color:var(--text2)}
.outline button:hover{background:var(--sunk)}

/* drive editors */
.fbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:var(--bw) solid var(--line);background:var(--surface);font-size:14px;position:sticky;top:64px;z-index:4}
.fbar .fx{font:italic 600 14px/1 "Newsreader",serif;color:var(--muted);padding:0 6px}
.fbar .cellref{font:500 13px/1 var(--mono);padding:8px 10px;border-radius:8px;background:var(--sunk);min-width:56px;text-align:center}
.fbar input{flex:1;border:0;outline:0;background:none;min-height:36px;font:500 14px/1 var(--mono);color:var(--text)}
.sheetwrap{overflow:auto;max-height:calc(100vh - 220px)}
.sheet{border-collapse:collapse;font-size:13.5px;background:var(--surface)}
.sheet th{position:sticky;top:0;background:var(--surface2);font:600 12px/1 var(--font);color:var(--muted);padding:8px;border:1px solid var(--line);min-width:110px;z-index:2}
.sheet th:first-child,.sheet td:first-child{position:sticky;left:0;min-width:46px;width:46px;background:var(--surface2);text-align:center;color:var(--muted);font:600 12px/1 var(--font);z-index:3}
.sheet td{border:1px solid var(--line);padding:0;height:34px}
.sheet td input{width:100%;height:33px;border:0;outline:0;background:none;padding:0 8px;font:500 13.5px/1 var(--mono);color:var(--text)}
.sheet td input:focus{box-shadow:inset 0 0 0 2px var(--action);background:var(--action-tint)}
.sheet tr.hdr-r td input{font-weight:700;font-family:var(--font)}
.sheet td.num input{text-align:right}
.stabs{display:flex;gap:2px;padding:6px 10px;border-top:var(--bw) solid var(--line);background:var(--surface2);position:sticky;bottom:0;overflow-x:auto}
.stabs button{min-height:38px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text2)}
.stabs button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--sh1)}
.slides{display:grid;grid-template-columns:180px minmax(0,1fr);gap:18px;padding:18px}
.snav{display:grid;gap:10px;align-content:start;max-height:calc(100vh - 200px);overflow:auto;padding:2px}
.snav button{display:grid;grid-template-columns:18px 1fr;gap:6px;align-items:start;font:600 12px/1 var(--mono);color:var(--muted);text-align:left}
.snav .th{aspect-ratio:16/9;border-radius:8px;background:var(--surface);border:var(--bw) solid var(--line);overflow:hidden;position:relative}
.snav button[aria-current="true"] .th{box-shadow:0 0 0 2.5px var(--action)}
.stage16{aspect-ratio:16/9;border-radius:14px;background:var(--surface);box-shadow:var(--sh2);border:var(--bw) solid var(--line);position:relative;overflow:hidden;container-type:inline-size}
.sl{position:absolute;inset:0;padding:7cqw;display:flex;flex-direction:column;justify-content:center;gap:2cqw;background:radial-gradient(60% 80% at 100% 100%,rgba(var(--glow),.35),transparent 70%),#16171B;color:#F3F1EB}
.sl.light{background:#FFFEFA;color:#16171B}
.sl h2{font:700 6.5cqw/1 var(--font-d);letter-spacing:-.04em}
.sl p{font-size:2.4cqw;opacity:.8;max-width:60%}
.sl .chip{align-self:flex-start;min-height:auto;padding:1cqw 2cqw;font-size:1.6cqw;border-radius:99px}
.sl [contenteditable]{outline:none}
.sl [contenteditable]:focus{box-shadow:0 0 0 2px var(--action);border-radius:4px}
.notes{margin-top:14px;padding:14px;border-radius:14px;background:var(--surface);border:var(--bw) solid var(--line);font-size:14px;color:var(--text2);min-height:80px}
.imged{display:grid;grid-template-columns:64px minmax(0,1fr) 260px;min-height:calc(100vh - 64px)}
.itools{display:grid;align-content:start;gap:4px;padding:10px;border-right:var(--bw) solid var(--line);background:var(--surface)}
.itools button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--text2)}
.itools button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.icanvas{display:grid;place-items:center;padding:24px;background:repeating-conic-gradient(var(--sunk) 0 25%,var(--surface2) 0 50%) 0 0/22px 22px;overflow:hidden}
.ipic{width:min(620px,100%);aspect-ratio:4/3;border-radius:6px;position:relative;box-shadow:var(--sh3);background:radial-gradient(60% 70% at 30% 30%,#9C8BFF,transparent),radial-gradient(60% 70% at 80% 70%,#FF8A6B,transparent),radial-gradient(40% 50% at 60% 20%,#FFC633,transparent),#2B2050;transition:filter 200ms,transform 400ms var(--e-out)}
.ipic .cropbox{position:absolute;inset:10% 12%;border:2px solid #fff;box-shadow:0 0 0 999px rgba(0,0,0,.45)}
.ipic .cropbox i{position:absolute;width:14px;height:14px;background:#fff;border-radius:3px}
.ipic .cropbox i:nth-child(1){left:-7px;top:-7px}.ipic .cropbox i:nth-child(2){right:-7px;top:-7px}.ipic .cropbox i:nth-child(3){left:-7px;bottom:-7px}.ipic .cropbox i:nth-child(4){right:-7px;bottom:-7px}
.ipic .mk{position:absolute;left:58%;top:28%;padding:6px 10px;border-radius:8px;background:#FFC633;color:#1C1504;font:700 13px/1 var(--font);box-shadow:0 4px 0 #C98F00}
.ipanel{padding:16px;border-left:var(--bw) solid var(--line);background:var(--surface);display:grid;align-content:start;gap:14px}
.rng{display:grid;gap:6px;font-size:13px;color:var(--text2)}
.rng input{width:100%;accent-color:var(--action);height:28px}

/* whiteboard */
.wb{position:relative;height:calc(100vh - 64px);height:calc(100dvh - 64px);overflow:hidden;background:radial-gradient(var(--line2) 1.2px,transparent 1.2px) 0 0/24px 24px,var(--surface2);touch-action:none;cursor:default}
.wb-world{position:absolute;left:0;top:0;transform-origin:0 0}
.wb-tools{position:absolute;left:14px;top:50%;transform:translateY(-50%);z-index:5;display:grid;gap:4px;padding:6px;border-radius:18px;background:var(--surface);border:var(--bw) solid var(--line);box-shadow:var(--sh3)}
.wb-tools button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--text2)}
.wb-tools button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.wb-zoom{position:absolute;right:14px;bottom:14px;z-index:5;display:flex;align-items:center;gap:2px;padding:4px;border-radius:14px;background:var(--surface);border:var(--bw) solid var(--line);box-shadow:var(--sh2);font:600 13px/1 var(--mono)}
.wb-zoom button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.wb-mini{position:absolute;right:14px;bottom:70px;z-index:5;width:170px;height:110px;border-radius:14px;background:var(--surface);border:var(--bw) solid var(--line);box-shadow:var(--sh2);overflow:hidden}
.wb-mini i{position:absolute;background:var(--c);border-radius:2px;opacity:.8}
.wb-mini .vp{position:absolute;border:2px solid var(--action);border-radius:4px}
.sticky{position:absolute;width:180px;min-height:160px;padding:16px;border-radius:4px 4px 18px 4px;background:var(--c);color:#1C1A12;font:500 15px/1.35 var(--font);box-shadow:0 1px 0 rgba(0,0,0,.08),0 14px 24px -12px rgba(0,0,0,.35);cursor:grab;user-select:none;transform:rotate(var(--r,0deg));transition:box-shadow 200ms}
.sticky.drag{cursor:grabbing;box-shadow:0 30px 40px -16px rgba(0,0,0,.45);transform:rotate(0) scale(1.04);z-index:3}
.sticky small{display:block;margin-top:10px;opacity:.6;font-size:12px}
.wframe{position:absolute;border:2px dashed var(--line2);border-radius:20px}
.wframe span{position:absolute;top:-30px;left:0;font:600 13px/1 var(--font);color:var(--muted);padding:6px 10px;border-radius:8px;background:var(--surface)}
.wshape{position:absolute;display:grid;place-items:center;font:600 14px/1.2 var(--font);text-align:center;padding:10px}
.wb-presence{display:flex;align-items:center;gap:6px}

/* value ladder */
.ladder{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;gap:14px;padding:40px 10px 10px;min-height:520px;perspective:1200px}
.step{position:relative;display:grid;align-content:start;gap:8px;padding:18px 16px;border-radius:22px;text-align:left;color:#16171B;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c));box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 calc(var(--h)*.04 + 6px) 0 color-mix(in srgb,var(--c) 60%,#000),0 40px 50px -30px color-mix(in srgb,var(--c) 70%,#000);height:var(--h);transition:transform 320ms var(--e-spring);animation:rise 700ms var(--e-spring) both;animation-delay:calc(var(--i)*90ms);transform-origin:bottom}
.step:hover,.step[aria-pressed="true"]{transform:translateY(-8px)}
.step[aria-pressed="true"]{outline:3px solid var(--text);outline-offset:4px}
.step .lv{font:600 11.5px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.step b{font:700 18px/1.15 var(--font-d);letter-spacing:-.02em}
.step .price{font:700 28px/1 var(--font-d);letter-spacing:-.03em;margin-top:auto}
.step small{font-size:12.5px;opacity:.75}
.ladder-arrow{position:absolute;left:4%;right:4%;top:8px;height:2px;background:linear-gradient(90deg,transparent,var(--line2));}
.ladder-arrow::after{content:"More value, higher price →";position:absolute;right:0;top:-24px;font:600 12px/1 var(--font);color:var(--muted)}

/* portal v4 */
.pnav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:10px clamp(12px,3vw,32px);background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:var(--bw) solid var(--line)}
.pnav .links{display:flex;gap:2px;margin:0 auto;padding:4px;border-radius:14px;background:var(--sunk)}
.pnav .links button{min-height:40px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;color:var(--text2);display:inline-flex;align-items:center;gap:7px;position:relative}
.pnav .links button[aria-current="page"]{background:var(--surface);color:var(--text);box-shadow:var(--sh1)}
.pnav .links .bd{min-width:18px;height:18px;border-radius:9px;background:#FF7A45;color:#fff;font:700 11px/18px var(--font);text-align:center;padding:0 5px}
.road{position:relative;margin:22px 0 10px;padding:26px 18px 18px;border-radius:32px;background:radial-gradient(70% 90% at 0% 0%,rgba(255,138,92,.16),transparent 60%),radial-gradient(60% 90% at 100% 100%,rgba(122,92,242,.14),transparent 60%),var(--surface);border:var(--bw) solid var(--line);box-shadow:var(--sh2);overflow:hidden}
.road svg.path{position:absolute;left:0;right:0;top:50px;width:100%;height:90px;overflow:visible}
.road .pbg{fill:none;stroke:var(--sunk);stroke-width:14;stroke-linecap:round}
.road .pfg{fill:none;stroke:url(#roadg);stroke-width:14;stroke-linecap:round;stroke-dasharray:1200;stroke-dashoffset:calc(1200 - 1200 * var(--p));animation:roadin 1.6s var(--e-out) .2s both}
@keyframes roadin{from{stroke-dashoffset:1200}}
.road .pdash{fill:none;stroke:rgba(255,255,255,.7);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round}
.miles{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.mile{display:grid;justify-items:center;gap:8px;text-align:center;padding-top:6px}
.mile:nth-child(even){padding-top:42px}
.mile .pin{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font:800 18px/1 var(--font-d);background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 2px var(--line2),0 4px 0 var(--line2);transition:transform 300ms var(--e-spring)}
.mile.done .pin{background:linear-gradient(160deg,#FFB27A,#FF7A45);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 0 #C4521F}
.mile.now .pin{background:linear-gradient(160deg,#B9A2FF,#7A5CF2);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 0 #5032C4,0 0 0 8px rgba(122,92,242,.18);animation:beat 2.2s ease-in-out infinite}
@keyframes beat{50%{transform:translateY(-4px) scale(1.05)}}
.mile b{font-size:14px}
.mile small{font-size:12px;color:var(--muted)}
.mile .you{font:700 11px/1 var(--font);color:#7A5CF2;background:rgba(122,92,242,.12);padding:4px 8px;border-radius:99px}
.rocket{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:linear-gradient(120deg,#1B1530,#2E1F5C);color:#F3F1EB;margin-top:14px}
.rocket .meter{flex:1;height:12px;border-radius:12px;background:rgba(255,255,255,.12);overflow:hidden}
.rocket .meter i{display:block;height:100%;width:var(--v);border-radius:12px;background:linear-gradient(90deg,#FF7A45,#FFC633)}
.rocket .rk{font-size:28px;animation:bob 2s ease-in-out infinite}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.bdg{display:grid;justify-items:center;gap:6px;width:96px;text-align:center;font-size:12px;font-weight:600;color:var(--text2)}
.bdg i{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-style:normal;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 0 var(--c3)}
.bdg.lock i{filter:grayscale(1) opacity(.45)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:conf 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes conf{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
.pnote{display:grid;gap:8px;padding:18px;border-radius:20px;background:var(--surface);border:var(--bw) solid var(--line);box-shadow:var(--sh1);text-align:left;transition:transform 240ms var(--e-out)}
.pnote:hover{transform:translateY(-3px) rotate(-.4deg)}
.pnote .hd{height:6px;border-radius:6px;background:var(--c)}

/* responsive */
@media (max-width:1180px){.builder{grid-template-columns:200px minmax(0,1fr)}.builder .propbox{grid-column:1/-1;position:static}.edbody{grid-template-columns:minmax(0,1fr)}.outline,.edbody>.side-panel{display:none}.ava{grid-template-columns:1fr 1fr}.ava-center{grid-column:1/-1;position:static;order:-1}.left .sp::after,.right .sp::after{display:none}}
@media (max-width:980px){.split{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.stagebar{grid-template-columns:repeat(3,minmax(0,1fr))}.imged{grid-template-columns:56px minmax(0,1fr)}.ipanel{grid-column:1/-1;border-left:0;border-top:var(--bw) solid var(--line)}.ladder{grid-template-columns:1fr;min-height:0}.step{height:auto!important;min-height:120px}}
@media (max-width:760px){
 .only-m{display:inline-grid}.hide-m{display:none!important}
 .content{padding:20px 16px 130px}
 .hdr{gap:4px;padding:8px 10px;min-height:60px}
 .hdr .searchbtn{width:44px;flex:0 0 44px;padding:0;justify-content:center;border:0;background:none;box-shadow:none}
 .hdr .searchbtn>span,.hdr .searchbtn kbd{display:none}
 .crumb{font-size:15px;overflow:hidden}.crumb>span{display:none}
 .grid2,.grid3,.row2{grid-template-columns:1fr}
 .stagebar{grid-template-columns:repeat(6,minmax(130px,1fr));overflow-x:auto;padding-bottom:6px}
 .tbl thead{display:none}.tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
 .tbl tr{padding:10px 6px;border-bottom:var(--bw) solid var(--line)}
 .tbl td{border:0;padding:4px 6px;display:flex;justify-content:space-between;gap:12px;text-align:right}
 .tbl td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;text-align:left}
 .tbl td.t1{display:block;text-align:left}.tbl td.t1::before{display:none}
 .tasklist .trow{grid-template-columns:44px minmax(0,1fr) 92px}.tasklist .trow>.hm{display:none}
 .kanban{grid-auto-columns:86%}
 .cal .dc{min-height:64px;padding:4px}.cal .ev{font-size:0;padding:0;height:6px;min-height:6px;border-radius:3px;border:0;background:var(--c)}.cal .dh{padding:8px 2px;text-align:center;font-size:10px}
 .builder{grid-template-columns:1fr}.palette{position:static;grid-template-columns:repeat(2,1fr)}
 .fcanvas{padding:16px}
 .slides{grid-template-columns:1fr}.snav{grid-auto-flow:column;grid-auto-columns:120px;max-height:none;overflow-x:auto}
 .imged{grid-template-columns:1fr}.itools{grid-auto-flow:column;justify-content:start;border-right:0;border-bottom:var(--bw) solid var(--line);overflow-x:auto}
 .ava{grid-template-columns:1fr}
 .wb-tools{left:50%;top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);grid-auto-flow:column}
 .wb-mini{display:none}.wb-zoom{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
 .wb{height:calc(100dvh - 60px - 64px)}
 .miles{grid-template-columns:repeat(6,minmax(86px,1fr));overflow-x:auto}.road svg.path{display:none}.mile:nth-child(even){padding-top:6px}
 .pnav .links{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;box-shadow:var(--sh3);background:var(--surface);border:var(--bw) solid var(--line)}
 .pnav .links button{flex-direction:column;gap:2px;min-height:52px;padding:4px 6px;font-size:11px;flex:1}
 .demo-fab{bottom:calc(84px + env(safe-area-inset-bottom,0px));padding:0 12px}.demo-fab span{display:none}
 .demo{bottom:calc(136px + env(safe-area-inset-bottom,0px))}
 .chead .acts{margin-left:0;width:100%}
 .ph .acts{margin-left:0}
 .pagehead .acts{width:100%}
 .shelf{padding:4px 4px 14px;border-radius:26px}
 .lx .l-hero h1{font-size:44px}
 .ed-tools{top:60px}.fbar{top:60px}
 .drawer{width:100%}
}
@media (prefers-reduced-motion:reduce){.rdrop,.flake,.cloudp,.haze{display:none}}
.only-mb{display:none}
.snav .th{container-type:inline-size}
@media (max-width:760px){.only-mb{display:block}.pipe{grid-auto-flow:row;grid-auto-columns:auto}.pipe .kcol:not(.sel){display:none}}
.inp input{min-width:0}.toolbar .inp.grow{flex:1 1 200px}
.side{z-index:35}
.demo-fab{left:auto;right:14px}
.demo{left:auto;right:14px;transform-origin:bottom right}
@media (max-width:760px){.demo-fab{right:10px}}
@media (max-width:760px){.pnav{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}.pnav .links .bd{position:absolute;top:2px;right:8px}.tasklist .trow.hd{display:none}.portal{padding-bottom:110px}}

/* ===== v5: rail shell ===== */
.shell{grid-template-columns:64px 248px minmax(0,1fr);--app:var(--action)}
.shell.sidecol{grid-template-columns:64px 0 minmax(0,1fr)}.shell.sidecol .side{visibility:hidden;padding:0;border:0}
.rail{position:sticky;top:0;height:100vh;height:100dvh;z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;background:#121317;color:#C9CBD1;border-right:1px solid rgba(255,255,255,.06)}
[data-concept] .rail{background:#121317}
.r-wrap{position:relative}
.r-org,.r-btn,.r-me{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#C9CBD1;position:relative;transition:background 180ms,transform 180ms var(--e-spring)}
.r-btn:hover,.r-org:hover{background:rgba(255,255,255,.08);color:#fff}
.r-me{border-radius:50%}
.r-div{width:28px;height:1px;background:rgba(255,255,255,.1);margin:4px 0}
.r-apps{display:grid;gap:6px}
.r-app{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;position:relative;transition:transform 220ms var(--e-spring)}
.r-app:hover{transform:translateY(-2px) scale(1.06)}
.r-app[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:#F3F1EB}
.r-sp{flex:1}
.r-badge{position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#FF5A47;color:#fff;font:700 10.5px/17px var(--font);text-align:center;font-style:normal;box-shadow:0 0 0 2px #121317}
.railmenu{left:calc(100% + 10px);right:auto;top:0;transform-origin:top left}
.railmenu.up{top:auto;bottom:0;transform-origin:bottom left}
.rail .appmenu{left:calc(100% + 10px);top:0}
.appmenu .grid a{display:grid;justify-items:center;gap:6px;padding:10px 2px;border-radius:14px;font-size:12px;font-weight:550;color:var(--text2);text-align:center;line-height:1.2;min-height:84px;text-decoration:none}
.appmenu .grid a:hover{background:var(--surface2);color:var(--text)}
.appmenu .grid a[aria-current="true"]{background:var(--brand-soft);color:var(--text)}
.appmenu .grid a.dim .plate{filter:saturate(.3) brightness(.85)}
.appmenu .home{text-decoration:none;color:var(--text)}
.menu-link{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:12px;color:var(--text);text-decoration:none;font-size:14px;font-weight:550}
.menu-link:hover{background:var(--sunk)}
.photo{display:inline-block;border-radius:50%;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.photo svg{width:100%;height:100%;display:block}
/* app sidebar */
.side{top:0;padding:12px 10px;gap:2px;background:var(--surface2)}
.side-top{padding:4px 6px 14px;gap:10px}
.side-top b{font-size:17px}
.nav a,.side-list a{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:10px;color:var(--text2);font-weight:550;font-size:14px;text-decoration:none;position:relative;transition:background 160ms,color 160ms}
.nav a:hover,.side-list a:hover{background:var(--sunk);color:var(--text)}
.nav a[aria-current="page"],.side-list a[aria-current="page"]{background:var(--surface);color:var(--text);box-shadow:var(--sh1)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--app)}
.nav .count{margin-left:auto;font:600 12px/1 var(--mono);color:var(--muted)}
.side-list a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-sec.sx{padding:14px 12px 6px;display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none}
.side-sec.sx::-webkit-details-marker{display:none}
.coll:not([open]) summary svg{transform:rotate(-90deg)}
.side .addrow{min-height:40px;font-size:13.5px}
.side .count{margin-left:auto;font:600 11.5px/1 var(--mono);color:var(--muted)}
/* slim app bar (replaces the 68px global header) */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;min-height:52px;padding:6px clamp(12px,2vw,24px);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:var(--bw) solid var(--line)}
.bar .grow,.toolbar .grow{flex:1}
.crumb{display:flex;align-items:center;gap:6px;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden}
.crumb a{color:var(--muted);text-decoration:none;font-weight:500}.crumb a:hover{color:var(--text)}
.crumb b{font-weight:650}.crumb .sep{color:var(--line2)}
.crumb.sm{font-size:13.5px}
.appsearch{min-height:38px;width:min(300px,30vw);background:var(--surface)}
.appsearch input{min-height:36px}
.iconbtn.sm{width:32px;height:32px}
.content{padding:24px clamp(16px,2.6vw,40px) 120px;max-width:1400px}
.backlink{text-decoration:none;color:var(--text2);padding-left:6px}
.btn{text-decoration:none}
a.card,a.linkrow,a.kcard,a.fname,a.folder,a.tile{text-decoration:none;color:inherit}
.linkrow{text-decoration:none;color:inherit}
.pv{font:600 10.5px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line2);border-radius:6px;padding:4px 6px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip.sm{min-height:30px;padding:0 8px;gap:6px;font-size:12.5px}
.chip.on,.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.warn{color:var(--warn);background:var(--warn-tint);border-color:transparent}

/* SYSTEM */
function rSystem(){const sw=(n,h,r)=>`<div class="sw" style="--c:${h}"><i></i><div><b>${n}</b><span>${h}</span><br>${r}</div></div>`;
const ui=['search','bell','grid','home','check','plus','upload','download','share','move','trash','star','lock','clock','list','tiles','filter','eye','msg','mail','alert','info','xcircle','wifi','shield','team','apps','doc','folder','clip','refresh','logout','sun','moon'];
return `<div class="wrap">
<div class="hero-sys"><div><p class="over">Layer2Funnels + Aurj · Design language v3</p><h1>Ink stage.<br>Paper desk.<br><em>One signal.</em></h1><p>The Launcher is a dark stage where apps sit as dimensional plates. Inside, work happens on calm paper surfaces. Yellow is the signal: it marks the one thing that matters on a screen. Blue means “do” and “done”.</p></div>${stack()}</div>
<section class="sys-sec"><header><span class="n">01</span><h2>Principles</h2></header><div class="princ">
<div><span class="num">a</span><b>Depth means something</b><p>3D is used for things you can open, press or pick up: app icons, the main next step, dragged files. Lists and tables stay flat.</p></div>
<div><span class="num">b</span><b>Stage, then desk</b><p>Expressive at the door (Launcher, sign in, empty states). Quiet at the desk, where people work for hours.</p></div>
<div><span class="num">c</span><b>One signal per screen</b><p>Yellow appears once per screen, on the item that needs you. If everything is yellow, nothing is.</p></div>
<div><span class="num">d</span><b>Motion explains change</b><p>Things grow from where you tapped, settle with a small spring, and never make you wait more than half a second.</p></div></div></section>
<section class="sys-sec"><header><span class="n">02</span><h2>Colour</h2><p>Every colour has one job. Success is blue, never green. Neutrals are warm and never pure black or white.</p></header>
<p class="over" style="margin-bottom:10px">Layer2Funnels</p><div class="sw-row">${sw('Ink','#16171B','Text, stage, ink buttons')}${sw('Paper','#F3F1EB','Light background')}${sw('Signal','#FFC633','The one thing that needs you')}${sw('Volt','#2B63F6','Actions, links, success')}${sw('Amber text','#8A5200','Warnings, on #FFF0D2')}${sw('Brick','#BA3126','Errors, on #FCE8E4')}</div>
<p class="over" style="margin:18px 0 10px">Aurj (until brand files arrive)</p><div class="sw-row">${sw('Plum ink','#1A1317','Text, stage')}${sw('Cream','#F6F0EB','Light background')}${sw('Rose','#B0305A','Brand signal')}${sw('Teal','#0C7F95','Actions, success')}</div>
<p class="over" style="margin:18px 0 10px">App plates</p><div class="sw-row">${APPS.slice(0,12).map(a=>`<div class="sw" style="--c:linear-gradient(160deg,${a.c[0]},${a.c[1]})"><i></i><div><b>${a.name}</b><span>${a.c[1]}</span></div></div>`).join('')}</div></section>
<section class="sys-sec"><header><span class="n">03</span><h2>Type</h2><p>Bricolage Grotesque for headlines (also used by Funnel Mapper Pro, so the family feels related). Geist for the interface. Geist Mono for numbers. Aurj adds Noto Nastaliq Urdu.</p></header><div class="typescale">
<div class="ts"><small>Display · 72/0.95 · 700</small><span class="d" style="font:700 clamp(40px,6vw,72px)/.95 var(--font-d);letter-spacing:-.05em">Good evening.</span></div>
<div class="ts"><small>H1 · 44/1 · 700</small><span class="d" style="font:700 44px/1 var(--font-d);letter-spacing:-.04em">Needs your attention</span></div>
<div class="ts"><small>H2 · 22/1.2 · 700</small><span class="d" style="font:700 22px/1.2 var(--font-d)">Shared with you</span></div>
<div class="ts"><small>Body · Geist 15/1.5</small><span>Clients can’t sign in until the security tests pass. Your work is saved as you go.</span></div>
<div class="ts"><small>Label · 12 caps +12%</small><span class="over">Recent updates</span></div>
<div class="ts"><small>Numbers · Geist Mono</small><span class="mono" style="font-size:22px">$12,480 · 64.2% · 22 Oct</span></div>
<div class="ts"><small>Aurj · Nastaliq</small><span style="font:600 34px/2 var(--urdu)">عروج</span></div></div></section>
<section class="sys-sec"><header><span class="n">04</span><h2>App icons</h2><p>Each app is a pressed plate: a gradient face, a lit top edge, a darker base you can see from the front, and a soft floor shadow. Glyphs share one 2px line.</p></header>
<div class="icon-wall">${APPS.map(a=>`<figure>${plate(a,72)}<figcaption>${a.name}</figcaption></figure>`).join('')}</div>
<div class="sizes">${[96,64,44,34,28].map(s=>`<div style="display:grid;justify-items:center;gap:8px">${plate(app('clients'),s)}<small class="mono muted">${s}</small></div>`).join('')}<div style="display:grid;justify-items:center;gap:8px">${mark('l2f',64)}<small class="mono muted">L2F mark*</small></div><div style="display:grid;justify-items:center;gap:8px">${mark('aurj',64)}<small class="mono muted">Aurj mark*</small></div></div>
<p class="hint" style="margin-top:12px">* Placeholder marks. They will be replaced by your real logo files.</p></section>
<section class="sys-sec"><header><span class="n">05</span><h2>Interface icons</h2><p>24px grid, 1.8px stroke, round ends. Drawn for this system, so every icon has the same weight and corner.</p></header><div class="uiic">${ui.map(n=>`<figure>${ic(n,24)}<figcaption>${n}</figcaption></figure>`).join('')}</div></section>
<section class="sys-sec"><header><span class="n">06</span><h2>Controls</h2><p>Buttons have a visible base and sink 2px when pressed. Every target is at least 44px.</p></header>
<div class="ctrls"><button class="btn primary" data-act="toast:Primary: the main action. One per screen.">${ic('plus',18,'',2.2)}New client</button><button class="btn ink" data-act="noop">Save changes</button><button class="btn action" data-act="noop">Approve</button><button class="btn ghost" data-act="noop">Cancel</button><button class="btn quiet" data-act="noop">More options</button><button class="btn ghost" aria-disabled="true" data-act="toast:Turned-off buttons stay visible and explain why.">${ic('lock',16)}Turn on</button></div>
<div class="ctrls"><span class="pill">Not started</span><span class="pill blue">${ic('check',13,'',2.6)}Done</span><span class="pill warn">${ic('clock',13,'',2.2)}Due tomorrow</span><span class="pill brand">Needs you</span><span class="pill danger">${ic('x',12,'',2.6)}Denied</span><kbd>⌘</kbd><kbd>/</kbd></div>
<div style="max-width:380px"><div class="field"><label for="demo-f">Client name</label><input id="demo-f" placeholder="Harry Kaye PT"></div></div></section>
<section class="sys-sec"><header><span class="n">07</span><h2>Depth</h2><p>Four levels. Most of the product lives on 0 and 1.</p></header><div class="depth">
<div><div class="lv" style="background:var(--sunk);border-color:transparent">0</div><p><b>Floor.</b> Page background, wells, inputs.</p></div>
<div><div class="lv" style="box-shadow:var(--sh1)">1</div><p><b>Sheet.</b> Lists, tables, panels. Hairline edge.</p></div>
<div><div class="lv" style="box-shadow:var(--sh2)">2</div><p><b>Raised.</b> The current item, the next step, selected nav.</p></div>
<div><div class="lv" style="box-shadow:var(--sh3);transform:translateY(-8px)">3</div><p><b>Floating.</b> Menus, dialogs, toasts, dragged files.</p></div></div></section>
<section class="sys-sec"><header><span class="n">08</span><h2>Motion</h2><p>Fast out, soft landing. Only transform and opacity move. With reduced motion, changes are instant and still clear.</p></header>
<div class="mtabw"><table class="mtab"><thead><tr><th>Moment</th><th>Time</th><th>Curve</th><th>Try</th></tr></thead><tbody>
<tr><td>Press: buttons sink 2px</td><td>120ms</td><td>ease-out</td><td><button class="btn ghost sm" data-act="noop">Press me</button></td></tr>
<tr><td>Hover lift on plates, cards</td><td>240–380ms</td><td>(.22,1,.36,1)</td><td>Hover any app icon</td></tr>
<tr><td>Menus and dialogs: scale from 94%</td><td>220–300ms</td><td>spring (.34,1.56,.64,1)</td><td><button class="btn ghost sm" data-act="demo-dlg">Open dialog</button></td></tr>
<tr><td>Status change: check draws, item settles</td><td>300ms</td><td>spring</td><td><button class="btn ghost sm" data-act="demo-spring"><span class="spring-demo" id="sdemo">${ic('check',18,'',2.4)}</span></button></td></tr>
<tr><td>Signature: app opens from its own icon</td><td>480ms</td><td>(.2,.8,.2,1)</td><td><button class="btn ghost sm" data-act="nav:launcher">Go to Launcher</button></td></tr>
<tr><td>Page change: crossfade</td><td>260ms</td><td>ease-out</td><td>Use the dock</td></tr></tbody></table></div></section></div>`}

/* AUTH */

check:`${plate({id:'mail',c:['#6E98FF','#2B5CF0','#1A3BAE']},64)}<h1 style="margin-top:20px">Confirm your email</h1><p class="lede">We sent a link to <b>tabish@layer2funnels.com</b>. Open it on this device to continue.</p><button class="btn ink full" data-act="resend" id="resend">Resend email</button><button class="btn quiet full" style="margin-top:8px" data-act="auth:signup">Use a different email</button>`,

newpw:`<h1>Choose a new password</h1><p class="lede">You’ll use it next time you sign in.</p>${fld('np-1','New password','password','autocomplete="new-password"')}${fld('np-2','Confirm new password','password','autocomplete="new-password"')}<ul class="rules" id="rules"><li data-r="len">${ic('check',16,'',2.4)}At least 10 characters</li><li data-r="match">${ic('check',16,'',2.4)}Both passwords match</li></ul><button class="btn primary full" data-act="savepw">Save new password</button>`,

noorg:`<h1>You’re signed in, but not in an organization yet</h1><p class="lede">Nothing to see until someone invites you.</p><ol class="steps"><li>Ask the person who uses this with you to invite your email.</li><li>Open the invitation email and accept it.</li><li>Your apps appear on the Launcher straight away.</li></ol><button class="btn ink full" data-act="checkinv">${ic('refresh',18)}Check for invitations</button><p class="hint" id="inv-r" role="status" style="text-align:center;margin-top:10px"></p><p style="text-align:center;margin-top:6px"><button class="linkbtn" data-act="toast:Signed out.">Sign out</button></p>`,

function rStates(){return `<div class="wrap"><div class="pg-h"><p class="over">Shared states · every app</p><h1>When things are loading, empty, broken or off limits.</h1><p>One wording and one layout for each state, so people learn it once. Colour is never the only signal: errors have ✗, success has ✓, warnings have a triangle.</p></div><div class="spec-grid">

<div class="spec"><div class="cap">No results</div><div class="panel cen"><span class="iconbtn" style="background:var(--sunk);width:56px;height:56px;border-radius:18px">${ic('search',26)}</span><h3>No matches for “refund”</h3><p>Try fewer words, or check the spelling.</p><button class="btn ghost" data-act="noop">Clear search</button></div></div>

<div class="spec"><div class="cap">Error · save</div><div class="panel"><div class="field" style="margin:0"><label for="se1">Offer name</label><input id="se1" value="Starter coaching pack" aria-invalid="true" aria-describedby="se1e"><p class="err" id="se1e">${ic('xcircle',16)}Couldn’t save. Your changes are still here. Try again.</p></div><button class="btn ink" style="justify-self:start" data-act="toast:Saved.:ok">Try again</button></div></div>

/* CONCEPTS */
function rConcepts(){const C=[['signal','Signal','Recommended','Ink stage at the door, warm paper desk inside. Yellow marks the one thing that needs you, blue means do and done. Tactile 3D on icons and the next step only.','Daily work for years. Feels premium without tiring the eyes.'],
['paper','Paper Studio','Calm','Editorial. Serif headlines, ink rules instead of shadows, highlighter yellow. Reads like a premium agency report.','Client-facing screens and the Portal. Less “tech”, more trust.'],
['glass','Night Glass','Most wow','Always dark. Deep navy, translucent glass panels and soft coloured light behind them. The demo-day look.','Launcher and presentations. Heavier on long workdays and older laptops.'],

function usRun(){const raw=($('#usq')?.value||'').toLowerCase();const arch=/is:archived/.test(raw),me=/@me/.test(raw),od=/overdue/.test(raw);const q=raw.replace(/is:archived|@me|overdue/g,'').trim();
let items=SEARCH.flatMap(f=>f()).filter(r=>(US.scope==='all'||r.app===US.scope)&&(arch?r.arch:!r.arch||q.length>2)&&(!me||r.me)&&(!od||r.od));
items=items.map(r=>({...r,sc:Math.max(fz(r.t,q),fz(r.s||'',q)*.6)})).filter(r=>r.sc>0).sort((a,b)=>b.sc-a.sc);
const R=$('#usr');if(!R)return;
if(!q&&!arch&&!me&&!od){R.innerHTML=`<h5>Quick actions</h5>${[['plus','New task','nav:tasks/today','tasks'],['doc','New document','nav:drive/edit/doc/new','drive'],['projects','New project','nav:projects/home','projects'],['clients','New client','nav:clients/pipeline','clients'],['mic','Start meeting notes','nav:agents/meeting/new','agents']].map(([i,l,a,ap])=>`<button data-act="${a}" data-close>${plate(app(ap),28)}<span class="main"><b>${l}</b></span></button>`).join('')}<h5>Jump back in</h5>${items.slice(0,5).map(usRow('')).join('')}`;R.querySelector('button')?.setAttribute('aria-selected','true');return}

return dShell('drive/home',`${typeChips()}<div class="cathead"><span class="ft ${T[1]} big">${ic(T[2],22)}</span><div><h1 class="t1">${T[0]}</h1><p class="hint">${L.length} ${T[0].toLowerCase()} you can open in ${DRV.sp==='personal'?'Personal':'Library'} and shared with you</p></div><span class="grow"></span>${DTYPE.v==='form'?`<a class="btn primary sm" href="#/forms/list">${plate(app('forms'),18)}Open Forms</a>`:['pdf','image'].includes(DTYPE.v)?`<button class="btn primary sm" data-act="toast:Upload ${T[0]}.">${ic('upload',15)}Upload</button>`:`<a class="btn primary sm" href="#/drive/edit/${DTYPE.v}/new">${ic('plus',15,'',2.2)}New ${T[3].toLowerCase()}</a>`}</div>
${tpls.length?`<p class="over" style="margin:4px 0 8px">Start a new ${T[3].toLowerCase()}</p><div class="tpl-row">${tpls.map((n,i)=>`<a class="tpl ${!i?'new':''}" href="#/drive/edit/${DTYPE.v}/new">${i?`<span class="thumb" data-t="${T[1]}"></span>`:ic('plus',26)}<b>${n}</b></a>`).join('')}</div>`:''}
<div class="tb6" style="margin-top:6px"><span class="over">All ${T[0].toLowerCase()}</span><span class="grow"></span><select class="sel sm"><option>Anywhere</option><option>Library</option><option>Personal</option><option>Shared with me</option></select><select class="sel sm"><option>Last modified</option><option>Name</option></select></div>
${DTYPE.v==='form'?`<div class="tbl6"><div class="thd"><span>Form</span><span>Status</span><span>Responses</span><span></span><span></span><span></span></div>${FORMS.map(f=>`<a class="tr" href="#/forms/b/${f[0]}"><span class="t1c"><span class="ft forms" style="width:26px;height:26px;border-radius:7px">${ic('forms',13)}</span><b>${f[1]}</b></span><span>${f[2]}</span><span>${f[3]}</span><span></span><span></span><span></span></a>`).join('')}</div>`:L.length?fRows(L):emptyS(stack('mini-stack'),`No ${T[0].toLowerCase()} yet`,'Start one above or upload.','')}`,[['Drive'],[T[0]]])};
/* Docs editor: Google Docs-style ruler */
const _ed6=editor6;editor6=function(t,id){let h=_ed6(t,id);if(t==='doc')h=h.replace('<div class="dcanvas">',`<div class="dcanvas"><div class="ruler" aria-label="Ruler: drag the triangles to set margins and indents"><div class="rl-in">${Array.from({length:33},(_,i)=>`<i class="${i%4===0?'maj':i%2===0?'mid':''}">${i%4===0&&i>0&&i<32?i/4:''}</i>`).join('')}<span class="rl-mg l" title="Left margin"></span><span class="rl-mg r" title="Right margin"></span><span class="rl-ind" title="First-line indent"></span><span class="rl-tab" style="left:62%" title="Tab stop"></span></div></div>`).replace('<article class="dpage"','<div class="vruler"></div><article class="dpage"');return h};
/* Planner: focused Strategy map page (builder only), plan → project */
const _sm6=strategyModel;strategyModel=function(tab){if(tab!=='map')return _sm6(tab);const P=PLN();
const S=[[P.n,1],[org()==='aurj'?'Aurj Academy':'Funnel Done Right Challenge',0],[org()==='aurj'?'3 pieces of content daily.':'Q1 Delivery',0]];const stats=`${P.fa.length} focus areas · ${pobjs().length} objectives · ${pobjs().reduce((s,o)=>s+o.kpi.length,0)} KPIs · ${pobjs().reduce((s,o)=>s+o.tasks.length,0)} tasks · used by 1 plan`;
return plShell('planner/model',`<div class="smtop"><h1 class="t1">Strategy model</h1><div class="tabs6 inline">${[['map','Strategy map'],['kinds','Objective kinds'],['kpi','KPI types'],['fa','Focus areas'],['horizons','Time horizons'],['tpl','Templates']].map(([k,l])=>`<a href="#/planner/model/${k}" aria-selected="${k==='map'}">${l}</a>`).join('')}</div></div>
<div class="smbar2"><div class="stratpick"><button class="plsel" data-act="stratmenu" aria-haspopup="true">${ic('map',16)}${S[PS.strat][0]}${ic('down',14)}</button><small>${stats}</small></div><span class="grow"></span><button class="btn ghost sm" data-act="plnewstrat">${ic('plus',15)}New strategy</button><button class="btn primary sm" data-act="toast:Plan created with these focus areas, objectives, KPIs and tasks.:ok">${ic('planner',15)}Create a plan from it</button><button class="btn ghost sm" data-act="strat2proj">${plate(app('projects'),18)}Create a project from it</button><button class="iconbtn sm" aria-label="More" data-act="toast:Rename · Duplicate · Delete strategy">${ic('more',16)}</button></div>${builder(P)}`,[['Planner'],['Strategy model']],{wide:true})};
const _pp6=planPage;planPage=function(tab){return _pp6(tab).replace('<a class="btn quiet sm hide-m" href="#/planner/plan/slow/builder">See loading state</a>','').replace('<div class="tabs6 big">',`<div class="planacts"><button class="btn ghost sm" data-act="plan2proj">${plate(app('projects'),18)}Create a project from this plan</button><button class="iconbtn sm" aria-label="Plan actions" data-act="planmenu">${ic('more',16)}</button></div><div class="tabs6 big">`)};
const _vp6=VIEWS.planner;VIEWS.planner=p=>{if(p[0]==='alignment')return alignment6();return _vp6(p)};
const ALN={mode:'plans',open:new Set(['root','pl1','pl2'])};
function alignment6(){const P=PLN();const v=Math.round(pobjs().reduce((s,o)=>s+o.pr,0)/pobjs().length);
const box=(id,title,sub,pr,col,kids,lvl)=>`<div class="at-node" style="--c:${col}"><div class="at-box">${kids?`<button class="at-tg" data-act="altg:${id}" aria-label="${ALN.open.has(id)?'Collapse':'Expand'}">${ic(ALN.open.has(id)?'down':'right',13)}</button>`:''}<span class="ring xs" style="--v:${pr};--rc:${col}"></span><span><b>${title}</b><small>${sub}</small></span><span class="mono">${pr}%</span></div>${kids&&ALN.open.has(id)?`<div class="at-kids">${kids}</div>`:''}</div>`;
const objs=f=>f.obj.map((o,i)=>box(f.id+i,o.n,`${PEOPLE[o.ow][0]} · ${KST[o.st][0]}`,o.pr,f.c,'',3)).join('');
const tree=ALN.mode==='plans'?box('root',`${oname()} vision`,'2 plans',v,'#16171B',box('pl1',P.n,`${P.fa.length} focus areas · next review not set`,v,'#2B63F6',P.fa.map(f=>box(f.id,f.n,`${f.obj.length} objectives`,Math.round(f.obj.reduce((s,o)=>s+o.pr,0)/f.obj.length),f.c,objs(f),2)).join(''),1)+box('pl2','Q1 2027 Delivery','2 focus areas · child plan',0,'#7E5BF2','',1),0):box('root',P.n,'Objectives of this plan',v,'#2B63F6',P.fa.map(f=>box(f.id,f.n,`${f.obj.length} objectives`,0,f.c,objs(f),1)).join(''),0);
return plShell('planner/alignment',`${plTop('Alignment')}<div class="tb6">${vsw([['plans','Plans'],['objectives','Objectives of one plan']],ALN.mode,'almode')}<span class="grow"></span><button class="btn quiet sm" data-act="alall">Expand all</button><button class="iconbtn sm" aria-label="Zoom out" data-act="alz:-1">${ic('zout',16)}</button><button class="iconbtn sm" aria-label="Zoom in" data-act="alz:1">${ic('zin',16)}</button></div><div class="atree"><div class="at-world" style="transform:scale(${ALN.z||1})">${tree}</div></div><p class="hint" style="margin-top:8px">How plans roll up into each other, left to right. Click a box to open it; use the arrows to expand or collapse.</p>`,[['Planner'],['Alignment']])}
Object.assign(ACT,{almode:v=>{ALN.mode=v;draw()},altg:v=>{ALN.open.has(v)?ALN.open.delete(v):ALN.open.add(v);draw()},alall:()=>{['root','pl1','pl2',...PLN().fa.map(f=>f.id)].forEach(x=>ALN.open.add(x));draw()},alz:v=>{ALN.z=Math.min(1.4,Math.max(.6,(ALN.z||1)+(+v)*.1));draw()},
stratmenu:(v,t)=>{const r=t.getBoundingClientRect();const P=PLN();ctxMenu({preventDefault(){},clientX:r.left,clientY:r.bottom+4},[[ 'map',P.n,'plstrat:0'],['map',org()==='aurj'?'Aurj Academy':'Funnel Done Right Challenge','plstrat:1'],['map',org()==='aurj'?'3 pieces of content daily.':'Q1 Delivery','plstrat:2'],'-',['plus','New strategy','plnewstrat']])},
strat2proj:()=>dlg({icon:plate(app('projects'),52),title:'Create a project from this strategy',body:`<p>A new project starts with one section per focus area and one task per objective. KPIs stay in Planner.</p><div class="field" style="margin-top:12px"><label>Project name</label><input value="${PLN().n}"></div><div class="field"><label>Type</label><select><option>Internal</option><option>Client</option></select></div><p class="hint">Projects builds the project. Planner only sends the structure.</p>`,acts:[['Cancel','noop'],['Create project','toast:Project created in Projects.:ok','primary']]}),
plan2proj:()=>dlg({icon:plate(app('projects'),52),title:'Create a project from this plan',body:`<p>Turns “${PLN().n}” into a project: focus areas become sections and objectives become tasks with their owners and due dates. The plan keeps tracking progress and links to the project.</p><div class="field" style="margin-top:12px"><label>Project name</label><input value="${PLN().n}"></div><div class="row2"><div class="field"><label>Type</label><select><option>Internal</option><option>Client</option><option>Personal</option></select></div><div class="field"><label>Include</label><select><option>Objectives and tasks</option><option>Objectives only</option></select></div></div>`,acts:[['Cancel','noop'],['Create project','toast:Project created and linked to the plan.:ok','primary']]}),
planmenu:(v,t)=>{const r=t.getBoundingClientRect();ctxMenu({preventDefault(){},clientX:r.right-240,clientY:r.bottom+4},[['projects','Create a project from this plan','plan2proj'],['edit','Edit plan details','plnewplan'],['copy','Duplicate plan','toast:Duplicated.:ok'],['archive','Archive plan','toast:Archived.','danger']])}});

(function(){if(!location.hash)location.replace('#/launcher');route(true)})();

</script>
