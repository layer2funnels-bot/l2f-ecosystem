<section class="sys-sec"><header><span class="n">03</span><h2>Type</h2><p>Bricolage Grotesque for headlines (also used by Funnel Mapper Pro, so the family feels related). Geist for the interface. Geist Mono for numbers. Aurj adds Noto Nastaliq Urdu.</p></header><div class="typescale">

<section class="sys-sec"><header><span class="n">04</span><h2>App icons</h2><p>Each app is a pressed plate: a gradient face, a lit top edge, a darker base you can see from the front, and a soft floor shadow. Glyphs share one 2px line.</p></header>
<div class="icon-wall">${APPS.map(a=>`<figure>${plate(a,72)}<figcaption>${a.name}</figcaption></figure>`).join('')}</div>
<div class="sizes">${[96,64,44,34,28].map(s=>`<div style="display:grid;justify-items:center;gap:8px">${plate(app('clients'),s)}<small class="mono muted">${s}</small></div>`).join('')}<div style="display:grid;justify-items:center;gap:8px">${mark('l2f',64)}<small class="mono muted">L2F mark*</small></div><div style="display:grid;justify-items:center;gap:8px">${mark('aurj',64)}<small class="mono muted">Aurj mark*</small></div></div>
<p class="hint" style="margin-top:12px">* Placeholder marks. They will be replaced by your real logo files.</p></section>
<section class="sys-sec"><header><span class="n">05</span><h2>Interface icons</h2><p>24px grid, 1.8px stroke, round ends. Drawn for this system, so every icon has the same weight and corner.</p></header><div class="uiic">${ui.map(n=>`<figure>${ic(n,24)}<figcaption>${n}</figcaption></figure>`).join('')}</div></section>
<section class="sys-sec"><header><span class="n">06</span><h2>Controls</h2><p>Buttons have a visible base and sink 2px when pressed. Every target is at least 44px.</p></header>
<div class="ctrls"><button class="btn primary" data-act="toast:Primary: the main action. One per screen.">${ic('plus',18,'',2.2)}New client</button><button class="btn ink" data-act="noop">Save changes</button><button class="btn action" data-act="noop">Approve</button><button class="btn ghost" data-act="noop">Cancel</button><button class="btn quiet" data-act="noop">More options</button><button class="btn ghost" aria-disabled="true" data-act="toast:Turned-off buttons stay visible and explain why.">${ic('lock',16)}Turn on</button></div>
<div class="ctrls"><span class="pill">Not started</span><span class="pill blue">${ic('check',13,'',2.6)}Done</span><span class="pill warn">${ic('clock',13,'',2.2)}Due tomorrow</span><span class="pill brand">Needs you</span><span class="pill danger">${ic('x',12,'',2.6)}Denied</span><kbd>⌘</kbd><kbd>/</kbd></div>
<div style="max-width:380px"><div class="field"><label for="demo-f">Client name</label><input id="demo-f" placeholder="Harry Kaye PT"></div></div></section>
<section class="sys-sec"><header><span class="n">07</span><h2>Depth</h2><p>Four levels. Most of the product lives on 0 and 1.</p></header><div class="depth">
<div><div class="lv" style="background:var(--sunk);border-color:transparent">0</div><p><b>Floor.</b> Page background, wells, inputs.</p></div>
<div><div class="lv" style="box-shadow:var(--sh1)">1</div><p><b>Sheet.</b> Lists, tables, panels. Hairline edge.</p></div>
<div><div class="lv" style="box-shadow:var(--sh2)">2</div><p><b>Raised.</b> The current item, the next step, selected nav.</p></div>
<div><div class="lv" style="box-shadow:var(--sh3);transform:translateY(-8px)">3</div><p><b>Floating.</b> Menus, dialogs, toasts, dragged files.</p></div></div></section>
<section class="sys-sec"><header><span class="n">08</span><h2>Motion</h2><p>Fast out, soft landing. Only transform and opacity move. With reduced motion, changes are instant and still clear.</p></header>
<div class="mtabw"><table class="mtab"><thead><tr><th>Moment</th><th>Time</th><th>Curve</th><th>Try</th></tr></thead><tbody>
<tr><td>Press: buttons sink 2px</td><td>120ms</td><td>ease-out</td><td><button class="btn ghost sm" data-act="noop">Press me</button></td></tr>
<tr><td>Hover lift on plates, cards</td><td>240–380ms</td><td>(.22,1,.36,1)</td><td>Hover any app icon</td></tr>
<tr><td>Menus and dialogs: scale from 94%</td><td>220–300ms</td><td>spring (.34,1.56,.64,1)</td><td><button class="btn ghost sm" data-act="demo-dlg">Open dialog</button></td></tr>
<tr><td>Status change: check draws, item settles</td><td>300ms</td><td>spring</td><td><button class="btn ghost sm" data-act="demo-spring"><span class="spring-demo" id="sdemo">${ic('check',18,'',2.4)}</span></button></td></tr>
<tr><td>Signature: app opens from its own icon</td><td>480ms</td><td>(.2,.8,.2,1)</td><td><button class="btn ghost sm" data-act="nav:launcher">Go to Launcher</button></td></tr>
<tr><td>Page change: crossfade</td><td>260ms</td><td>ease-out</td><td>Use the dock</td></tr></tbody></table></div></section></div>`}

function toast(msg,kind='info',ms=3200){const d=document.createElement('div');d.className='toast '+kind;d.innerHTML=`${ic(kind==='ok'?'check':kind==='warn'?'alert':'info',18,'',2.2)}<span>${msg}</span>`;$('#toasts').append(d);setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),300)},ms)}
let lastFocus;function dlg({icon,title,body,acts}){lastFocus=document.activeElement;$('#dlg').innerHTML=`${icon||''}<h2 id="dlgt">${title}</h2>${/^\s*</.test(body)?body:'<p>'+body+'</p>'}<div class="acts">${acts.map(([l,a,k])=>`<button class="btn ${k||'ghost'}" data-act="${a}">${l}</button>`).join('')}</div>`;$('#scrim').hidden=false;setTimeout(()=>$$('#dlg button').pop().focus(),30)}
function closeDlg(){$('#scrim').hidden=true;lastFocus?.focus?.()}
function zoom(el,a,after){if(reduce||!el){after();return}const r=el.getBoundingClientRect(),W=innerWidth,Hh=innerHeight;const o=document.createElement('div');o.className='zoom';o.style.background=`linear-gradient(160deg,${a.c[0]},${a.c[1]})`;o.style.setProperty('--g',a.g||'#FFFEFA');o.innerHTML=ic(a.id,Math.round(r.width*.47),'gl',2);document.body.append(o);const g=$('svg',o);
const ins=`inset(${r.top}px ${W-r.right}px ${Hh-r.bottom}px ${r.left}px round ${r.width*.29}px)`;
o.animate([{clipPath:ins},{clipPath:'inset(0px 0px 0px 0px round 0px)'}],{duration:480,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
g.animate([{transform:`translate(${r.left+r.width/2-W/2}px,${r.top+r.height/2-Hh/2}px)`},{transform:'translate(0,0) scale(2.2)',opacity:.9}],{duration:480,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'}).finished.then(()=>{after();o.animate([{opacity:1},{opacity:0}],{duration:300,easing:'ease-out',fill:'forwards'}).finished.then(()=>o.remove())})}

const appState=id=>id==='portal'?'locked':id==='agents'?'soon':id==='planner'?'later':(id==='fmp'&&org()==='aurj')?'notset':'ok';

/* ---------- shell ---------- */
function orgSwitch(){return `<div class="orgwrap"><button class="orgbtn" data-act="orgmenu" aria-haspopup="true" aria-expanded="false">${mark(org(),28)}<span>${oname()}</span>${ic('down',16)}</button>
<div class="menu" hidden role="menu"><p class="over">Your organizations</p>${Object.keys(ORG).map(o=>`<button role="menuitemradio" aria-checked="${o===org()}" data-act="org:${o}">${mark(o,36)}<span><b>${ORG[o].name}</b><small>${ORG[o].lvl} · ${o==='l2f'?'funnel agency':'education'}</small></span>${o===org()?ic('check',18,'chk',2.4):''}</button>`).join('')}<p class="hint" style="padding:8px 10px 4px">Switching keeps you on this page. Each organization’s data stays separate.</p></div></div>`}
function appsBtn(id){return `<div class="appsw"><button class="launch-btn" data-act="appsw" aria-haspopup="true" aria-expanded="false" aria-label="Switch app">${ic('grid',20)}</button><div class="appmenu" hidden role="menu"><button class="home" data-act="nav:launcher"><span class="mini">${ic('home',18)}</span>Back to Launcher</button><div class="grid">${APPS.map(a=>`<button data-act="open:${a.id}" aria-current="${a.id===id}" class="${appState(a.id)!=='ok'?'dim':''}">${plate(a,40)}${a.name}</button>`).join('')}</div></div></div>`}
function hdr(id,crumbs,o={}){const s=o.search?`<button class="searchbtn" data-act="${o.search}" aria-label="Search">${ic('search',18)}<span>${o.searchLabel||'Search'}</span><kbd>Ctrl K</kbd></button>`:`<button class="search" aria-disabled="true" data-act="toast:Search arrives when the backend is ready.">${ic('search',18)}<span>Search</span><kbd>/</kbd></button>`;
return `<header class="hdr"><span class="only-m">${appsBtn(id)}</span><div class="crumb">${crumbs.map((c,i)=>i===0?`<b style="white-space:nowrap">${c[0]}</b>`:`<span>/ ${c[1]?`<button class="linkbtn" style="color:inherit;font-weight:500;min-height:0" data-act="nav:${c[1]}">${c[0]}</button>`:c[0]}</span>`).join('')}</div>${s}<button class="iconbtn hide-m" aria-disabled="true" aria-label="Notifications, available when the backend is ready" data-act="toast:Notifications arrive when the backend is ready.">${ic('bell')}</button>${orgSwitch()}<span class="avatar hide-m" title="Tabish Riaz">TR</span></header>`}
const isOn=(n,cur)=>n[0]===cur||(n[4]||[]).some(k=>k[0]===cur);
function navItem(n,cur){const[p,l,i,c,kids]=n;return `<div class="grp"><button data-act="nav:${p}" ${p===cur?'aria-current="page"':''}>${ic(i)}<span>${l}</span>${c?`<span class="count">${c}</span>`:''}</button>${kids&&isOn(n,cur)?`<div class="sub">${kids.map(k=>`<button data-act="nav:${k[0]}" ${cur===k[0]?'aria-current="page"':''}>${ic(k[2],18)}<span>${k[1]}</span></button>`).join('')}</div>`:''}</div>`}
function bbar(nav,cur){const more=nav.length>5,items=more?nav.slice(0,4):nav;return `<nav class="bbar" aria-label="Sections">${items.map(n=>`<button data-act="nav:${n[0]}" ${isOn(n,cur)?'aria-current="page"':''}><span class="pillic">${ic(n[2],22)}</span>${n[5]||n[1]}</button>`).join('')}${more?`<button data-act="more" ${nav.slice(4).some(n=>isOn(n,cur))?'aria-current="page"':''}><span class="pillic">${ic('more',22)}</span>More</button>`:''}</nav>`}
function shell(id,o){const a=app(id);CURNAV=o.nav;return `<div class="shell"><aside class="side"><div class="side-top">${appsBtn(id)}${plate(a,34)}<b>${a.name}</b></div>${o.sideTop||''}<nav class="nav" aria-label="${a.name}">${o.nav.map(n=>navItem(n,o.cur)).join('')}</nav>${o.sideMid||''}<div class="side-foot">${av('TR')}<div><b>Tabish Riaz</b><small>${ORG[org()].lvl} · ${oname()}</small></div></div></aside>
<div class="main">${hdr(id,o.crumbs||[[a.name]],o)}<div class="content ${o.wide?'wide':''} ${o.flush?'flush':''}">${o.body}</div></div></div>${bbar(o.nav,o.cur)}`}
const head=(title,lede,acts='')=>`<div class="pagehead"><div><h1 class="h1">${title}</h1>${lede?`<p class="lede">${lede}</p>`:''}</div>${acts?`<div class="acts">${acts}</div>`:''}</div>`;
const tabs=(list,cur,pre)=>`<div class="tabs" role="tablist">${list.map(([k,l,n])=>`<button role="tab" aria-selected="${k===cur}" data-act="nav:${pre}${k}">${l}${n!=null?`<span class="n">${n}</span>`:''}</button>`).join('')}</div>`;
const vsw=(list,cur,act)=>`<div class="vsw" role="group">${list.map(([k,l,i])=>`<button aria-pressed="${k===cur}" data-act="${act}:${k}">${i?ic(i,16):''}${l}</button>`).join('')}</div>`;
const emptyS=(icon,t,p,btn='')=>`<div class="empty">${icon}<h3>${t}</h3><p>${p}</p>${btn}</div>`;
const sp=(i,t)=>`<span class="pill ${t||''}">${i}</span>`;
function openDrawer(html){const d=$('#drawer');d.innerHTML=html;d.classList.add('open');setTimeout(()=>d.querySelector('button,input')?.focus(),60)}
function closeMenus(){$$('.menu,.appmenu').forEach(m=>m.hidden=true);$$('[data-act="orgmenu"],[data-act="appsw"]').forEach(b=>b.setAttribute('aria-expanded','false'))}
function confetti(){if(reduce)return;const c=document.createElement('div');c.className='confetti';const cols=['#FFC633','#FF7A45','#7A5CF2','#2B63F6','#13A592','#E9488F'];c.innerHTML=Array.from({length:90},()=>`<i style="left:${Math.random()*100}%;background:${cols[Math.random()*6|0]};--x:${(Math.random()-.5)*300}px;--r:${Math.random()*900}deg;animation-delay:${Math.random()*.4}s"></i>`).join('');document.body.append(c);setTimeout(()=>c.remove(),2400)}

/* ---------- router ---------- */
function nav(path,noVT){const [a,...p]=path.split('/');const run=()=>{RT={a,p};draw();scrollTo(0,0)};closeMenus();$('#drawer').classList.remove('open');if(document.startViewTransition&&!reduce&&!noVT)document.startViewTransition(run);else run()}

if(st==='locked')return dlg({icon:plate(a,56),title:'Client Portal is locked for clients',body:'Clients can’t sign in until the security tests pass. You can preview exactly what a client will see. Only an owner can switch it on.',acts:[['Turn on (unavailable)','toast:Available after the security tests pass.','quiet'],['Preview client view','nav:portal/home','primary']]});
if(st==='soon')return dlg({icon:plate(a,56),title:'Layer 2 Agents is coming later',body:'Nothing runs yet, and nothing will run until you approve the provider, the cost and the data rules. Every app is being built with a safe place for it to plug in.',acts:[['Close','noop','ink']]});

if(st==='notset')return dlg({icon:plate(a,56),title:'Funnel Mapper Pro isn’t set up in Aurj',body:'It’s turned on for Layer2Funnels only. Switch there to use it, or ask an admin to set it up here.',acts:[['Ask an admin','toast:Saved as a request. Sending needs the backend.','quiet'],['Switch to Layer2Funnels','org:l2f','primary']]});
if(id==='fmp')return toast('Funnel Mapper Pro opens as its own app, under this same header.');
const T={office:'office/home',projects:'projects/home',clients:'clients/list',drive:'drive/home',forms:'forms/list',ladder:'ladder/list',whiteboard:'whiteboard/home',social:'social/calendar'}[id];
const p=el?.querySelector?.('.plate');if(p&&RT.a==='launcher')zoom(p,a,()=>nav(T,true));else nav(T)}
function setOrg(o){if(o===org())return;H.dataset.org=o;draw();toast(`Switched to ${ORG[o].name}. You stayed on the same page.`,'ok')}

/* ---------- demo controls ---------- */
function rDemo(){let f=$('#demofab');if(!f){f=document.createElement('div');f.id='demofab';document.body.append(f)}const o=(k,v,l,cur)=>`<button data-act="demo:${k}=${v}" aria-pressed="${cur===v}">${l}</button>`;
f.innerHTML=`<button class="demo-fab" data-act="demotoggle" aria-expanded="${!!window.demoOpen}">${ic('sliders',18)}<span>Prototype</span></button>${window.demoOpen?`<div class="demo" role="dialog" aria-label="Prototype controls"><h4>Screens</h4><div class="opts">${[['launcher','Launcher'],['auth','Sign in'],['states','States'],['system','System'],['concepts','Concepts']].map(([k,l])=>`<button data-act="nav:${k}" aria-pressed="${RT.a===k}">${l}</button>`).join('')}</div>
<h4>Organization</h4><div class="opts">${o('org','l2f','Layer2Funnels',org())}${o('org','aurj','Aurj',org())}</div><h4>Theme</h4><div class="opts">${o('theme','light','Light',H.dataset.theme)}${o('theme','dark','Dark',H.dataset.theme)}</div>
<h4>Launcher time</h4><div class="opts">${['auto','morning','afternoon','evening','night'].map(v=>o('time',v,v[0].toUpperCase()+v.slice(1),DEMO.time)).join('')}</div><h4>Launcher weather</h4><div class="opts">${[['auto','Auto'],['clear','Clear'],['cloud','Cloudy'],['rain','Rain'],['hot','Hot'],['cold','Cold']].map(([v,l])=>o('wx',v,l,DEMO.wx)).join('')}</div></div>`:''}`}

/* ---------- launcher ---------- */
const tod=()=>{if(DEMO.time!=='auto')return DEMO.time;const h=new Date().getHours();return h<5?'night':h<12?'morning':h<17?'afternoon':h<21?'evening':'night'};
const WX={clear:['Clear','sun',24],cloud:['Cloudy','cloud',19],rain:['Light rain','rain',16],hot:['Very hot','heat',41],cold:['Cold','snow',3]};
const wxNow=()=>DEMO.wx==='auto'?'cloud':DEMO.wx;
VIEWS.launcher=()=>{const t=tod(),w=wxNow(),W=WX[w];const g={morning:'Good morning',afternoon:'Good afternoon',evening:'Good evening',night:'Working late'}[t];
const tile=(a,i)=>{const st=appState(a.id);const pill={locked:`<span class="pill">${ic('lock',12,'',2.4)}Locked</span>`,soon:'<span class="pill">Soon</span>',notset:'<span class="pill">Not here</span>',later:'<span class="pill">Next round</span>'}[st]||'';
return `<button class="tile" style="--i:${i}" data-st="${st==='later'?'ok':st}" data-name="${a.name.toLowerCase()}" data-act="open:${a.id}" aria-label="${a.name}">${pill}<span class="shadowf"></span>${plate(a,80)}<span class="t-name">${a.name}</span><span class="t-desc">${a.desc}</span></button>`};
const line={morning:'Fresh start. ',afternoon:'',evening:'Winding down. ',night:'It’s late, so only what matters. '}[t];
return `<section class="lx t-${t} w-${w}"><div class="sky"></div><div class="orb"></div><div class="tint"></div><div class="wx" id="wx"></div><div class="l-wrap"><div class="l-top on-stage">${orgSwitch()}<div style="display:flex;gap:6px;align-items:center"><button class="iconbtn" style="color:#fff" data-act="demo:theme=${H.dataset.theme==='dark'?'light':'dark'}" aria-label="Change theme">${ic(H.dataset.theme==='dark'?'sun':'moon')}</button><span class="avatar">TR</span></div></div>
<div class="l-hero"><span class="wxchip" title="Based on your location. You can turn this off in your profile.">${ic(w==='clear'&&t==='night'?'moon':W[1],18)}${W[0]} · ${W[2]}° · your location</span><h1>${g},<br><em>Tabish.</em></h1><p class="sub">${line}${org()==='l2f'?'3 things need you today. Start in Office.':'2 lessons are waiting for review in Office.'}</p>
<label class="l-find">${ic('search',20)}<span class="sr">Find an app</span><input id="findapp" placeholder="Find an app" autocomplete="off"><kbd>/</kbd></label></div>
<div class="shelf"><div class="l-group"><h2>Everyday</h2><div class="l-grid">${['office','projects','clients','drive','planner','portal'].map((id,i)=>tile(app(id),i)).join('')}</div></div>
<div class="l-group"><h2>Studio</h2><div class="l-grid">${['forms','ladder','social','whiteboard','fmp','agents'].map((id,i)=>tile(app(id),i+6)).join('')}</div></div><p class="l-empty" id="l-empty" hidden></p></div>
<p class="l-foot">You see the apps you’ve been given in ${oname()}. The sky follows your time of day and local weather.</p></div></section>`};
AFTER.launcher=()=>{const w=wxNow(),x=$('#wx');if(!x||reduce)return;let h='';const R=Math.random;
if(w==='rain')h=Array.from({length:70},()=>`<i class="rdrop" style="left:${R()*110}%;animation-duration:${.55+R()*.4}s;animation-delay:${-R()*2}s"></i>`).join('');
if(w==='cold')h=Array.from({length:60},()=>{const s=2+R()*4;return `<i class="flake" style="left:${R()*100}%;width:${s}px;height:${s}px;animation-duration:${6+R()*8}s;animation-delay:${-R()*12}s"></i>`}).join('');
if(w==='cloud'||w==='rain')h+=Array.from({length:5},(_, i)=>`<i class="cloudp" style="top:${4+i*9}%;width:${260+R()*260}px;height:${70+R()*60}px;animation-duration:${60+R()*50}s;animation-delay:${-R()*80}s"></i>`).join('');
if(w==='hot')h='<i class="haze"></i>';x.innerHTML=h};

ACT.lstep=v=>{const s=LAD[+v];$$('.step').forEach((b,i)=>b.setAttribute('aria-pressed',i===+v));openDrawer(`<div class="drw-h"><span class="pill">Step ${+v+1} · ${s[1]}</span><span class="grow"></span><button class="iconbtn" data-act="drawerx" aria-label="Close">${ic('x')}</button></div><h2 class="drw-title">${s[0]}</h2><p class="tx2">${s[3]}</p><div class="sec-t">${ic('link',16)}Linked offer</div>${+v===3?`<div class="notice danger">${ic('alert',18)}<span>The linked offer was archived. Pick another, or keep this step as a gap.</span></div>`:`<div class="linkrow" style="background:var(--sunk)">${ic('offer')}<span class="main"><b>${s[0]}</b><small>Offers & Products · ${s[2]}</small></span><span class="pill blue">Linked</span></div>`}<div class="sec-t">Audience and value</div><dl class="kv2"><dt>For</dt><dd>Busy mums getting back to fitness</dd><dt>Why next</dt><dd>Natural step after ${+v?LAD[+v-1][0]:'first visit'}</dd><dt>Owner</dt><dd>${av('UM')} Usman</dd></dl><div class="sec-t">Assumptions</div><p class="tx2">About 20% move up to this step.</p>`)};

/* ================= WHITEBOARD ================= */
const WB={z:.9,x:40,y:10,tool:'cursor',items:[{t:'frame',x:20,y:30,w:620,h:420,l:'Quiz funnel flow'},{t:'s',x:60,y:80,c:'#FFE58F',x2:'Instagram reel',r:-2},{t:'s',x:260,y:110,c:'#FFC2D8',x2:'10-question quiz',r:1.5},{t:'s',x:460,y:80,c:'#BDE8DF',x2:'Personal result page',r:-1},{t:'s',x:160,y:260,c:'#C9D8FF',x2:'Book a discovery call',r:2},{t:'s',x:380,y:270,c:'#E1D6FF',x2:'Follow-up emails × 5',r:-1.5},{t:'shape',x:720,y:90,w:200,h:120,c:'#2B63F6',l:'Decision: price?'},{t:'s',x:720,y:270,c:'#FFE58F',x2:'Idea: add a “before/after” question',r:1}]};
VIEWS.whiteboard=p=>{const pg=p[0]||'home';
if(pg==='home')return shell('whiteboard',{nav:[['whiteboard/home','Boards','whiteboard'],['whiteboard/tpl','Templates','copy']],cur:'whiteboard/home',body:`${head('Whiteboards',`Shared boards for ${oname()}. Project boards stay in Projects.`,`<button class="btn primary" data-act="nav:whiteboard/board/new">${ic('plus',18,'',2.2)}New board</button>`)}<p class="over" style="margin-bottom:10px">Start from a template</p><div class="cardgrid" style="margin-bottom:26px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">${[['Blank','#7C818D'],['Funnel flow','#2B63F6'],['Brainstorm','#FFC633'],['Retro','#E9488F'],['Mind map','#13A592']].map(([n,c])=>`<button class="card" data-act="nav:whiteboard/board/new" style="padding:14px"><span style="height:80px;border-radius:12px;background:radial-gradient(var(--line2) 1px,transparent 1px) 0 0/12px 12px,color-mix(in srgb,${c} 14%,var(--surface2))"></span><b>${n}</b></button>`).join('')}</div><p class="over" style="margin-bottom:10px">Recent boards</p><div class="cardgrid">${[['Quiz funnel flow','Edited 10 min ago',1],['Q4 content ideas','Yesterday',0],['Team retro, October','Last week',1]].map(([n,m,s])=>`<button class="card" data-act="nav:whiteboard/board/b1"><span style="height:140px;border-radius:14px;position:relative;background:radial-gradient(var(--line2) 1px,transparent 1px) 0 0/14px 14px,var(--surface2);overflow:hidden">${['#FFE58F','#FFC2D8','#BDE8DF','#C9D8FF'].map((c,i)=>`<i style="position:absolute;left:${10+i*22}%;top:${20+(i%2)*30}%;width:18%;height:30%;background:${c};border-radius:3px;transform:rotate(${i%2?2:-2}deg)"></i>`).join('')}</span><h3>${n}${s?' '+ic('star',14).replace('fill="none"','fill="#E6A700" stroke="#E6A700"'):''}</h3><div class="foot">${avs(['TR','AR'])}${m}</div></button>`).join('')}</div>`});
if(pg==='tpl')return shell('whiteboard',{nav:[['whiteboard/home','Boards','whiteboard'],['whiteboard/tpl','Templates','copy']],cur:'whiteboard/tpl',body:head('Templates','Approved templates for your team.')+`<p class="hint">Owners and admins can save any board as a template.</p>`});
const T=[['cursor','Select (V)'],['hand','Pan (H)'],['sticky','Sticky note (S)'],['text','Text (T)'],['shape','Shape (R)'],['pen','Pen (P)'],['frame','Frame (F)'],['arrow','Connector (L)']];
return `<div class="ov-top"><button class="iconbtn" data-act="nav:whiteboard/home" aria-label="Back to boards">${ic('right',20).replace('<svg','<svg style="transform:scaleX(-1)"')}</button>${plate(app('whiteboard'),32)}<div class="grow"><b>Quiz funnel flow</b><small>${oname()} · Whiteboard</small></div><span class="savest hide-m"><i></i>Saved</span><button class="iconbtn hide-m" aria-label="Undo" data-act="noop">${ic('undo')}</button><button class="iconbtn hide-m" aria-label="Redo" data-act="noop">${ic('redo')}</button><span class="wb-presence hide-m">${avs(['TR','AR','SN'])}</span><button class="iconbtn" aria-label="Comments" data-act="toast:Comments and @mentions open here.">${ic('msg')}</button><button class="btn ghost sm hide-m" data-act="toast:Presents frames in order.">${ic('play',16)}Present</button><button class="btn primary sm" data-act="toast:Share opens board roles: viewer, commenter, editor.">${ic('share',16)}Share</button></div>
<div class="wb" id="wb"><div class="wb-tools" role="toolbar" aria-label="Board tools">${T.map(([k,l])=>`<button aria-label="${l}" title="${l}" aria-pressed="${WB.tool===k}" data-act="wtool:${k}">${ic(k,20)}</button>`).join('')}</div><div class="wb-world" id="wbw">${wbItems()}</div>
<div class="wb-mini" aria-hidden="true">${WB.items.map(i=>`<i style="left:${i.x/7}px;top:${i.y/7}px;width:${(i.w||180)/7}px;height:${(i.h||160)/7}px;--c:${i.t==='frame'?'transparent':i.c};${i.t==='frame'?'border:1px dashed var(--line2)':''}"></i>`).join('')}<span class="vp" style="left:4px;top:4px;width:110px;height:70px"></span></div>
<div class="wb-zoom"><button aria-label="Zoom out" data-act="wz:-1">${ic('zout',18)}</button><span id="wzl" style="min-width:52px;text-align:center">${Math.round(WB.z*100)}%</span><button aria-label="Zoom in" data-act="wz:1">${ic('zin',18)}</button><button aria-label="Fit" data-act="wz:0">${ic('target',18)}</button></div></div>`};
function wbItems(){return WB.items.map((i,k)=>i.t==='frame'?`<div class="wframe" style="left:${i.x}px;top:${i.y}px;width:${i.w}px;height:${i.h}px"><span>${i.l}</span></div>`:i.t==='shape'?`<div class="wshape sticky" data-k="${k}" style="left:${i.x}px;top:${i.y}px;width:${i.w}px;min-height:${i.h}px;background:color-mix(in srgb,${i.c} 14%,var(--surface));border:2px solid ${i.c};border-radius:18px;color:var(--text);--r:0deg;display:grid;place-items:center">${i.l}</div>`:`<div class="sticky" data-k="${k}" style="left:${i.x}px;top:${i.y}px;--c:${i.c};--r:${i.r}deg" ${''}><span contenteditable="true" spellcheck="false">${i.x2}</span><small>${['Tabish','Ayesha','Sana'][k%3]}</small></div>`).join('')}
AFTER.whiteboard=()=>wbApply();
function wbApply(){const w=$('#wbw');if(w)w.style.transform=`translate(${WB.x}px,${WB.y}px) scale(${WB.z})`;const l=$('#wzl');if(l)l.textContent=Math.round(WB.z*100)+'%'}
Object.assign(ACT,{wtool:v=>{WB.tool=v;$$('.wb-tools button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.act==='wtool:'+v));if(v==='sticky')toast('Click the board to add a sticky note.')},
wz:v=>{WB.z=+v===0?.9:Math.min(2,Math.max(.3,WB.z+(+v)*.15));if(+v===0){WB.x=40;WB.y=10}wbApply()}});
let wdrag=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest?.('#wb');if(!b||e.target.closest('.wb-tools,.wb-zoom,.wb-mini'))return;const s=e.target.closest('.sticky');
 if(WB.tool==='sticky'&&!s){const r=b.getBoundingClientRect();WB.items.push({t:'s',x:(e.clientX-r.left-WB.x)/WB.z-90,y:(e.clientY-r.top-WB.y)/WB.z-60,c:['#FFE58F','#FFC2D8','#BDE8DF','#C9D8FF'][WB.items.length%4],x2:'New idea',r:(Math.random()-.5)*4});$('#wbw').innerHTML=wbItems();WB.tool='cursor';ACT.wtool('cursor');return}
 if(s&&WB.tool==='cursor'){if(e.target.isContentEditable&&e.detail>1)return;const k=+s.dataset.k;wdrag={k,el:s,sx:e.clientX,sy:e.clientY,ox:WB.items[k].x,oy:WB.items[k].y};s.classList.add('drag');s.setPointerCapture?.(e.pointerId)}
 else{wdrag={pan:1,sx:e.clientX,sy:e.clientY,ox:WB.x,oy:WB.y};b.style.cursor='grabbing'}});
document.addEventListener('pointermove',e=>{if(!wdrag)return;const dx=e.clientX-wdrag.sx,dy=e.clientY-wdrag.sy;if(wdrag.pan){WB.x=wdrag.ox+dx;WB.y=wdrag.oy+dy;wbApply()}else{const it=WB.items[wdrag.k];it.x=wdrag.ox+dx/WB.z;it.y=wdrag.oy+dy/WB.z;wdrag.el.style.left=it.x+'px';wdrag.el.style.top=it.y+'px'}});
document.addEventListener('pointerup',()=>{if(!wdrag)return;wdrag.el?.classList.remove('drag');$('#wb')&&($('#wb').style.cursor='');wdrag=null});
document.addEventListener('wheel',e=>{if(!e.target.closest?.('#wb'))return;e.preventDefault();if(e.ctrlKey||e.metaKey){WB.z=Math.min(2,Math.max(.3,WB.z-e.deltaY*.002))}else{WB.x-=e.deltaX;WB.y-=e.deltaY}wbApply()},{passive:false});

/* ================= SOCIAL PLANNER ================= */
const CH={ig:['Instagram','#E9488F','IG'],li:['LinkedIn','#0F6CBD','in'],yt:['YouTube','#E5482F','YT'],fb:['Facebook','#2B5CF0','f']};
const POSTS=[[1,'ig','Quiz is live: find your fitness type','Scheduled'],[3,'li','Case study: 41 booked calls','In review'],[3,'ig','3 myths about funnels','Draft'],[6,'yt','Funnel teardown #4','Scheduled'],[8,'ig','Client win: Sarah','Approved'],[10,'li','Why we promise 30 days of fixes','Draft'],[14,'fb','Webinar reminder','Scheduled'],[-3,'ig','Behind the scenes','Published'],[-1,'li','October offer','Published']];
const PSC={Scheduled:'blue',Approved:'blue','In review':'warn',Draft:'',Published:'brand',Failed:'danger'};
const SNAV=[['social/calendar','Calendar','cal'],['social/posts','Posts','note'],['social/queue','Queue','list'],['social/approvals','Approvals','check',1],['social/channels','Channels','plug']];
const sShell=(cur,body)=>shell('social',{nav:SNAV,cur,body});
VIEWS.social=p=>{const pg=p[0]||'calendar';
if(pg==='calendar')return sShell('social/calendar',`${head('Calendar','Planned and scheduled posts for '+oname()+'.',`<button class="btn primary" data-act="compose">${ic('plus',18,'',2.2)}New post</button>`)}<div class="notice plain" style="margin-bottom:14px">${ic('plug',18)}<span>No channels connected yet. Posts can be planned and approved; publishing turns on after channels are connected and approved.</span></div><div class="toolbar"><b style="font:700 20px/1 var(--font-d)">October 2026</b><span class="grow"></span>${Object.values(CH).map(([n,c])=>`<span class="tag"><span class="dotc" style="--c:${c};width:8px;height:8px;margin-right:6px"></span>${n}</span>`).join('')}</div><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dh">${d}</div>`).join('')}${Array.from({length:42},(_,i)=>{const o=i-21,d=dOf(o);return `<div class="dc ${d.getMonth()!==9?'out':''} ${o===3?'today':''}"><span class="dn">${d.getDate()}</span>${POSTS.filter(x=>x[0]===o).map(x=>`<button class="ev" style="--c:${CH[x[1]][1]}" data-act="compose:${POSTS.indexOf(x)}">${CH[x[1]][2]} · ${x[2]}</button>`).join('')}</div>`}).join('')}</div>`);
if(pg==='posts'||pg==='queue'||pg==='approvals'){const L=pg==='approvals'?POSTS.filter(x=>x[3]==='In review'):pg==='queue'?POSTS.filter(x=>x[3]==='Scheduled'):POSTS;return sShell('social/'+pg,`${head({posts:'Posts',queue:'Queue',approvals:'Approvals'}[pg],{posts:'Drafts and versions for every channel.',queue:'What will publish, in order. Nothing publishes without approval.',approvals:'Posts waiting for a reviewer.'}[pg],`<button class="btn primary" data-act="compose">${ic('plus',18,'',2.2)}New post</button>`)}<div class="tblwrap"><table class="tbl"><thead><tr><th>Post</th><th>Channel</th><th>Date</th><th>Status</th></tr></thead><tbody>${L.map(x=>`<tr><td class="t1"><button class="fname" data-act="compose:${POSTS.indexOf(x)}">${ic('note')}${x[2]}</button></td><td data-l="Channel"><span class="tag" style="background:color-mix(in srgb,${CH[x[1]][1]} 16%,var(--surface));color:${CH[x[1]][1]}">${CH[x[1]][0]}</span></td><td data-l="Date">${dl(x[0])}</td><td data-l="Status"><span class="pill ${PSC[x[3]]}">${x[3]}</span></td></tr>`).join('')}</tbody></table></div>`)}
if(pg==='channels')return sShell('social/channels',`${head('Channels','Connected accounts. Managed by admins and channel owners.')}<div class="cardgrid">${Object.values(CH).map(([n,c,l])=>`<div class="card"><div class="integ"><span class="lg" style="--c:${c}">${l}</span><div><h3>${n}</h3><small class="muted">Not connected</small></div></div><button class="btn ghost sm" aria-disabled="true" data-act="toast:Connecting needs the provider review and the backend.">Connect</button></div>`).join('')}</div>`);
return sShell('social/calendar','')};
ACT.compose=v=>{const x=POSTS[+v]||[5,'ig','','Draft'];openDrawer(`<div class="drw-h"><b class="grow" style="font:700 20px/1 var(--font-d)">${v?'Edit post':'New post'}</b><button class="iconbtn" data-act="drawerx" aria-label="Close">${ic('x')}</button></div><p class="sec-t" style="margin-top:4px">Channels</p><div style="display:flex;gap:6px;flex-wrap:wrap">${Object.entries(CH).map(([k,[n,c]])=>`<button class="chip" aria-pressed="${k===x[1]}" style="${k===x[1]?`border-color:${c};color:${c};background:color-mix(in srgb,${c} 10%,var(--surface))`:''}" data-act="tgl">${n}</button>`).join('')}</div><div class="field" style="margin-top:14px"><label for="pt">Post text</label><textarea id="pt">${x[2]}</textarea></div><button class="chip" data-act="toast:Pick an image from Drive. It’s linked, not copied.">${ic('imgI',16)}Add media from Drive</button><p class="sec-t">Preview</p><div class="panel" style="padding:14px;display:grid;gap:10px"><div style="display:flex;gap:10px;align-items:center">${mark(org(),32)}<b style="font-size:14px">${oname()}</b><small class="muted">· ${CH[x[1]][0]}</small></div><p style="font-size:14px">${x[2]||'Your post text appears here.'}</p><span style="aspect-ratio:1;border-radius:12px;background:radial-gradient(60% 70% at 30% 30%,#9C8BFF,transparent),radial-gradient(60% 70% at 80% 70%,#FF8A6B,transparent),#2B2050"></span></div><div class="row2" style="margin-top:14px"><div class="field"><label for="pd">Date</label><input id="pd" value="${dOf(x[0]).toLocaleDateString('en-GB')}"></div><div class="field"><label for="ptm">Time</label><input id="ptm" value="18:30"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="toast:Sent for review.:ok">Submit for review</button><button class="btn ghost" data-act="toast:Draft saved.:ok">Save draft</button></div>`)};

(function(){const t=(location.hash||'').slice(1);nav(VIEWS[t]?t:'launcher',true)})();

</script>
