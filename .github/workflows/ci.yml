# Kept inside GitHub's free 2,000 minutes a month (private repository; owner decision, Nov 2026: $0, slower is fine).
#  - pull requests: the full checks, ONCE per commit (no second "push" run of the same commit); a newer push cancels the older run.
#    Changes that touch only documentation (*.md, docs/) do not start CI.
#  - push to main: only the quick guard (secrets, licences, tokens, files); the merged code was already tested in its pull request.
#  - every Sunday, and on demand: the full checks on main, including the mutation tests (they test the tests, not the app).
# Cloudflare Pages deploys through its own GitHub connection, not through these jobs, so deployment is unaffected.
name: ci
on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
  schedule: [{ cron: '41 22 * * 0' }]   # Sunday night (Monday 03:41 Pakistan time)
  workflow_dispatch: {}
permissions: { contents: read }
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # push to main: the quick guard only (about 1 minute)
  guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the FMP integrity check needs the fmp-copy-pristine tag
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run check:licences
      - run: npm run check:tokens
      - run: npm run check:v8css
      - run: npm run check:fmp-copy

  test:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: tester, POSTGRES_PASSWORD: tester, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U tester" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PG_URL: 'postgres://tester:tester@localhost:5432/postgres' }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the FMP integrity check needs the fmp-copy-pristine tag
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: PostgreSQL 17 client tools (pg_dump must match the postgres:17 service)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-17
      - run: echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run check:pg17   # tools AND the test server must be PostgreSQL 17, like Supabase
      - run: npm run check:secrets
      - run: npm run check:licences
      - run: npm run check:tokens
      - run: npm run check:v8css
      - run: npm run check:fmp-copy
      - run: DRIVERS=pglite,pg npm test
      - run: npm run drill:restore
      - run: npm run dryrun:fmp
      - name: Mutation tests (weekly and on demand; they check that the tests catch broken code)
        if: github.event_name != 'pull_request'
        run: npm run test:mutation

  # Real browser + real Supabase Auth + our routes + Postgres, all on the runner (Supabase CLI local stack, Docker). No live project.
  e2e:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with: { version: 2.121.0 }
      - name: Start the local Supabase stack and apply our migrations
        run: |
          npm run stack:start
          npm run stack:migrate
      - name: 'Whiteboard editor bundle (build-time dependencies of apps/whiteboard)'
        run: |
          npm ci --prefix apps/whiteboard
          node scripts/build-whiteboard.mjs
      - name: 'Docs Word support bundle (build-time dependencies of apps/docs-io)'
        run: |
          npm ci --prefix apps/docs-io
          node scripts/build-docs-io.mjs
      - name: 'Sheets .xlsx bridge (SheetJS CE official tarball, apps/sheetjs)'
        run: |
          npm ci --prefix apps/sheetjs
          node scripts/build-sheetjs.mjs
      - name: 'Planner bundle (apps/planner; the shell mounts /planner/embed.js at #/planner)'
        run: |
          npm ci --prefix apps/planner
          npm --prefix apps/planner run build
      - name: 'Projects bundle (apps/projects; the shell mounts /projects/embed.js at #/projects)'
        run: |
          npm ci --prefix apps/projects
          npm --prefix apps/projects run build
      - name: Playwright (not a project dependency; installed for this job only)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: API end-to-end (real Auth tokens)
        run: npm run test:e2e
      - name: Browser end-to-end (real Chromium)
        run: npm run test:e2e:ui
        env: { PLAYWRIGHT_MODULE: '${{ github.workspace }}/node_modules/playwright' }
      - name: 'Onboarding end-to-end (invitation e-mails to a fake Brevo, joining with and without the link, clients, profiles)'
        run: npm run test:e2e:onboarding
        env: { PLAYWRIGHT_MODULE: '${{ github.workspace }}/node_modules/playwright' }
      - name: 'Component gallery (Design v4, both organizations, light and dark, 390/768/1366)'
        run: npm run test:gallery
        env: { PLAYWRIGHT_MODULE: '${{ github.workspace }}/node_modules/playwright' }
      - name: 'Go-live rehearsal (runbook on the local stack: fresh database, bootstrap, build, smoke tests, encrypted backup and restore)'
        run: |
          sudo apt-get install -y -q age
          node scripts/rehearsal.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-shots, path: e2e-shots, if-no-files-found: ignore }
      - if: always()
        run: supabase stop --no-backup || true

  # The unedited Funnel Mapper Pro code copy must keep building and passing its own checks (its database and browser suites
  # need their own Supabase stack and run on demand: see docs/FMP_COPY_REPORT.md). No environment files, no live project.
  # On a pull request it runs only when the pull request changes apps/funnel-mapper (otherwise it ends after the check, under a minute).
  fmp-copy:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: { run: { working-directory: apps/funnel-mapper } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Does this change touch Funnel Mapper Pro?
        id: fmp
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -q '^apps/funnel-mapper/'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "::notice::No Funnel Mapper Pro files changed: its checks are skipped for this pull request."; fi
      - uses: actions/setup-node@v4
        if: steps.fmp.outputs.run == 'true'
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/funnel-mapper/package-lock.json }
      - if: steps.fmp.outputs.run == 'true'
        run: npm ci
      - if: steps.fmp.outputs.run == 'true'
        run: npm run check:files
      - if: steps.fmp.outputs.run == 'true'
        run: npm run lint
      - if: steps.fmp.outputs.run == 'true'
        run: npm test
      - if: steps.fmp.outputs.run == 'true'
        run: npm run build
      - if: steps.fmp.outputs.run == 'true'
        run: npm run typecheck
