# Nightly: the FULL Funnel Mapper Pro browser suite (195 tests, about 3 hours) on the copy in this repository AND on the original repository,
# so any difference between the two shows up the morning after. Everything runs on the runner against a local Supabase stack: no live project,
# no deploy. The original is only READ, with a read-only token the owner adds as the secret FMP_READ_TOKEN (fine-grained token, "Contents: read"
# on layer2funnels-bot/Funnel-Mapper only). Without the secret the "original" job skips cleanly and the copy still runs.
name: nightly-fmp
on:
  schedule: [{ cron: '17 2 * * *' }]
  workflow_dispatch:
    inputs:
      specs: { description: 'Optional spec filter, e.g. "canvas exports" (empty = all)', required: false, default: '' }
permissions: { contents: read }

jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    defaults: { run: { working-directory: apps/funnel-mapper } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: supabase/setup-cli@v1
        with: { version: 2.121.0 }
      - run: npm ci
      - run: cp .env.example .env.local
      - name: Local Supabase stack (FMP's own migrations and seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: npx playwright install --with-deps chromium
      - name: Full browser suite (the copy)
        run: npx playwright test --reporter=line,json ${{ inputs.specs }}
        env: { PLAYWRIGHT_JSON_OUTPUT_NAME: results.json, CI: 'true' }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmp-copy-results
          path: |
            apps/funnel-mapper/results.json
            apps/funnel-mapper/test-results/**/error-context.md
          retention-days: 14

  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - name: Is the read-only token present?
        id: t
        run: echo "ok=${{ secrets.FMP_READ_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.t.outputs.ok != 'true'
        run: echo "::notice::FMP_READ_TOKEN is not set, so the original repository is not tested tonight. Add a read-only token as that secret to compare against the original."
      - if: steps.t.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: layer2funnels-bot/Funnel-Mapper
          ref: 13a1e864   # the commit the copy was taken from; change deliberately
          token: ${{ secrets.FMP_READ_TOKEN }}
          persist-credentials: false
      - if: steps.t.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: steps.t.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with: { version: 2.121.0 }
      - if: steps.t.outputs.ok == 'true'
        run: npm ci && cp .env.example .env.local
      - if: steps.t.outputs.ok == 'true'
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - if: steps.t.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium
      - name: Full browser suite (the original)
        if: steps.t.outputs.ok == 'true'
        run: npx playwright test --reporter=line,json ${{ inputs.specs }}
        env: { PLAYWRIGHT_JSON_OUTPUT_NAME: results.json, CI: 'true' }
      - if: always() && steps.t.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fmp-original-results
          path: |
            results.json
            test-results/**/error-context.md
          retention-days: 14

  compare:
    needs: [copy, original]
    if: always() && needs.copy.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: results }
        continue-on-error: true
      - name: Differences between the original and the copy (by test)
        run: |
          node -e '
            const fs = require("fs");
            const load = (f) => { try { const r = JSON.parse(fs.readFileSync(f, "utf8")); const m = new Map();
              const walk = (s, file) => { for (const sp of s.specs || []) for (const t of sp.tests || []) m.set((sp.file || file) + " > " + sp.title, t.status);
                for (const c of s.suites || []) walk(c, c.file || file); };
              for (const s of r.suites || []) walk(s, s.file); return m; } catch { return null; } };
            const a = load("results/fmp-original-results/results.json"), b = load("results/fmp-copy-results/results.json");
            if (!b) { console.log("::warning::no copy results"); process.exit(0); }
            const count = (m) => { const c = {}; for (const v of m.values()) c[v] = (c[v] || 0) + 1; return JSON.stringify(c); };
            console.log("copy:", count(b));
            if (!a) { console.log("original: not run tonight"); process.exit(0); }
            console.log("original:", count(a));
            const diff = [...b].filter(([k, v]) => a.get(k) !== v);
            console.log(diff.length ? "DIFFERENT:\n" + diff.map(([k, v]) => `  ${k}: original ${a.get(k)}, copy ${v}`).join("\n") : "Same result on every test.");
            if (diff.length) console.log("::warning::" + diff.length + " tests differ between the original and the copy");
          '
